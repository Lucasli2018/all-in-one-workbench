<!DOCTYPE html>
<!-- 全能工作台：单文件 HTML + localStorage 本地存储，无需后端，双击即用 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>全能工作台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23FF9A76'/%3E%3Cstop offset='1' stop-color='%23F4553C'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='15' fill='url(%23g)'/%3E%3Crect x='12' y='12' width='17' height='17' rx='5' fill='white'/%3E%3Crect x='35' y='12' width='17' height='17' rx='5' fill='%23FFE08A'/%3E%3Crect x='12' y='35' width='17' height='17' rx='5' fill='white' opacity='.82'/%3E%3Crect x='35' y='35' width='17' height='17' rx='5' fill='white'/%3E%3C/svg%3E">
<style>
  :root{
    --coral:#FF7A59; --coral-d:#F2603C; --coral-l:#FFE9E2;
    --accent-2:#FF9A6B; --accent-soft:#FFD9CD; --accent-hover:#FF8A6B;
    --acc-rgb:255,122,89;
    --heat1:#FFD9CC; --heat2:#FFB199;
    --scroll:#E8C7BC; --scroll-h:#F0A48C;
    --item-hbg:#FFFBF9; --item-hbd:#FFD3C7;
    --banner-bg:#FFF1EE; --banner-bd:#FFD3C7;
    --ink:#2B2B33; --sub:#8A8A95; --line:#EFEFF2; --bg:#F7F8FA;
    --green:#27AE60; --red:#E8453C; --card:#FFFFFF;
    --shadow:0 4px 16px rgba(40,40,60,.06);
    --drawer-w:248px; --drawer-w-collapsed:72px; --topbar-h:56px; --nav-h:64px;
  }
  /* ---------- 主题：绿色 / 蓝色（覆盖主色与派生色，中性色不动） ---------- */
  body[data-theme="green"]{
    --coral:#27AE60; --coral-d:#1F8F4E; --coral-l:#E2F6EA;
    --accent-2:#57C487; --accent-soft:#C9EDD6; --accent-hover:#3BB56E;
    --acc-rgb:39,174,96;
    --heat1:#C9EDD6; --heat2:#82D4A4;
    --scroll:#BFE3CC; --scroll-h:#7FC99A;
    --item-hbg:#F7FCF9; --item-hbd:#C9EDD6;
    --banner-bg:#EDF9F1; --banner-bd:#C4EAD0;
  }
  body[data-theme="blue"]{
    --coral:#3E8BFF; --coral-d:#2B6FE3; --coral-l:#E3EEFF;
    --accent-2:#6EA8FF; --accent-soft:#CFE3FF; --accent-hover:#5B94FF;
    --acc-rgb:62,139,255;
    --heat1:#CFE3FF; --heat2:#8FB8FF;
    --scroll:#C2D7F5; --scroll-h:#93B8EE;
    --item-hbg:#F8FAFF; --item-hbd:#CFE3FF;
    --banner-bg:#EFF5FF; --banner-bd:#CBE0FA;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5;
    padding-bottom:calc(72px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:880px;margin:0 auto;padding:12px 14px 0;}
  /* Top bar — always visible; hosts hamburger on all viewports */
  header{
    position:sticky;top:0;z-index:35;background:linear-gradient(135deg,var(--coral),var(--accent-2));
    color:#fff;padding:8px 12px;box-shadow:0 2px 12px rgba(var(--acc-rgb),.28);
  }
  .head-row{display:flex;align-items:center;gap:10px;max-width:880px;margin:0 auto;}
  .menu-btn{flex:0 0 auto;width:38px;height:38px;border:none;background:rgba(255,255,255,.18);color:#fff;border-radius:10px;cursor:pointer;display:grid;place-items:center;transition:background .15s;}
  .menu-btn:active{background:rgba(255,255,255,.34);}
  .menu-btn svg{width:22px;height:22px;}
  .logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px;}
  .logo svg{width:22px;height:22px;}
  .spacer{flex:1;}
  .sync{display:flex;align-items:center;gap:6px;font-size:12px;background:rgba(255,255,255,.22);padding:5px 10px;border-radius:999px;}
  .sync .dot{width:8px;height:8px;border-radius:50%;background:#FFE08A;box-shadow:0 0 0 3px rgba(255,224,138,.3);}
  /* 顶栏「今天要处理」入口按钮 + 角标 */
  .today-btn{position:relative;}
  .today-badge{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;padding:0 4px;
    border-radius:999px;background:#fff;color:var(--coral-d);font-size:10px;font-weight:800;
    display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.18);}
  .today-badge[hidden]{display:none;}
  /* Today list（弹框内复用） */
  .today-list{max-height:190px;overflow:auto;padding:0 8px 8px;}
  .t-item{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:10px;}
  .t-item+.t-item{border-top:1px solid var(--line);}
  .t-ic{width:30px;height:30px;border-radius:9px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:var(--coral-l);color:var(--coral-d);}
  .t-ic svg{width:17px;height:17px;}
  .t-main{flex:1;min-width:0;}
  .t-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .t-meta{font-size:12px;color:var(--sub);margin-top:1px;}
  .t-overdue .t-title{color:var(--red);}
  .t-overdue .t-meta{color:var(--red);}
  .t-btn{flex:0 0 auto;border:none;background:var(--coral);color:#fff;font-size:13px;font-weight:600;padding:8px 12px;border-radius:9px;min-height:36px;cursor:pointer;}
  .t-empty{text-align:center;color:var(--sub);font-size:14px;padding:18px 0;}
  /* Tabs */
  .tabs{position:sticky;top:0;display:flex;gap:4px;background:var(--bg);padding:10px 14px;max-width:880px;margin:0 auto;z-index:20;overflow-x:auto;}
  .tab{flex:1;min-width:74px;border:none;background:transparent;color:var(--sub);font-size:14px;font-weight:600;padding:9px 4px;border-radius:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:.15s;}
  .tab svg{width:20px;height:20px;}
  .tab.active{background:var(--card);color:var(--coral-d);box-shadow:var(--shadow);}
  /* Section */
  .sec{display:none;}
  .sec.active{display:block;}
  .card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px;}
  .card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .card-h h3{margin:0;font-size:16px;display:flex;align-items:center;gap:7px;}
  .card-h .sub{font-size:12px;color:var(--sub);}
  .ic-btn{border:none;background:var(--coral-l);color:var(--coral-d);font-weight:600;font-size:13px;padding:7px 12px;border-radius:9px;cursor:pointer;min-height:38px;}
  /* 卡片头部「新增」图标按钮 */
  .add-ic{width:36px;height:36px;border:none;background:var(--coral-l);color:var(--coral-d);border-radius:11px;cursor:pointer;display:grid;place-items:center;flex:0 0 auto;transition:background .15s,transform .1s;}
  .add-ic:active{background:var(--accent-soft);transform:scale(.94);}
  .add-ic svg{width:20px;height:20px;}
  .card-h .add-ic{margin-left:8px;}
  /* Forms */
  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:11px;}
  .field label{font-size:13px;color:var(--sub);font-weight:600;}
  input,select,textarea{font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-family:inherit;width:100%;}
  textarea{resize:vertical;min-height:60px;}
  .row{display:flex;gap:10px;flex-wrap:wrap;}
  .row>*{flex:1;min-width:120px;}
  .btn-primary{width:100%;border:none;background:var(--coral);color:#fff;font-size:16px;font-weight:700;padding:13px;border-radius:12px;cursor:pointer;margin-top:4px;min-height:48px;}
  .btn-primary:active{background:var(--coral-d);}
  .seg{display:flex;gap:6px;background:var(--line);padding:4px;border-radius:11px;}
  .seg button{flex:1;border:none;background:transparent;color:var(--sub);font-weight:600;font-size:14px;padding:9px;border-radius:8px;cursor:pointer;}
  .seg button.on{background:#fff;color:var(--coral-d);box-shadow:0 1px 4px rgba(0,0,0,.06);}
  /* Data list */
  .list{display:flex;flex-direction:column;gap:8px;}
  /* 记账列表：按月 / 按日折叠头 */
  .fold-head{display:flex;align-items:center;gap:8px;padding:8px 6px;margin:4px 0 0;cursor:pointer;border-radius:9px;user-select:none;-webkit-user-select:none;transition:background .15s;}
  .fold-head:hover{background:rgba(var(--acc-rgb),.07);}
  .fold-head:active{background:rgba(var(--acc-rgb),.13);}
  .fold-head .fh-chev{flex:0 0 auto;width:14px;text-align:center;font-size:10px;color:var(--sub);}
  .fold-head .fh-t{font-weight:700;font-size:13.5px;color:var(--ink);}
  .fold-head.day .fh-t{font-weight:600;font-size:12.5px;color:var(--sub);}
  .fold-head .fh-s{margin-left:auto;font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap;}
  .item{display:flex;align-items:center;gap:11px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;}
  .item .chk{width:22px;height:22px;border-radius:7px;border:2px solid #D8D8DE;flex:0 0 auto;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .item.done .chk{background:var(--coral);border-color:var(--coral);}
  .item.done .chk svg{width:13px;height:13px;}
  .item.done .t1{text-decoration:line-through;color:var(--sub);}
  .item .body{flex:1;min-width:0;}
  .t1{font-size:15px;font-weight:600;}
  .t2{font-size:12px;color:var(--sub);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;}
  .pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;}
  .p-p0{background:#FFE0DC;color:var(--red);}
  .p-p1{background:#FFEFD6;color:#C8881A;}
  .p-p2{background:#E6F0FF;color:#2D6FE0;}
  .del{border:none;background:transparent;color:#C4C4CC;font-size:18px;cursor:pointer;padding:4px 6px;flex:0 0 auto;min-height:36px;}
  .amt-in{color:var(--green);font-weight:700;}
  .amt-out{color:var(--red);font-weight:700;}
  .cat-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:5px;}
  .empty{text-align:center;color:var(--sub);font-size:14px;padding:22px 0;}
  /* Stat cards */
  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  .stat{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:13px;}
  .stat .v{font-size:22px;font-weight:800;color:var(--coral-d);}
  .stat .k{font-size:12px;color:var(--sub);margin-top:2px;}
  /* Ring + pie */
  .chart-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center;}
  .legend{display:flex;flex-direction:column;gap:6px;font-size:13px;min-width:140px;}
  .legend div{display:flex;align-items:center;gap:7px;}
  /* Habit grid */
  .habit-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
  .hd{font-size:11px;color:var(--sub);text-align:center;padding-bottom:2px;}
  .day{aspect-ratio:1;border-radius:6px;background:var(--line);display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;}
  .day.empty{background:transparent;}
  /* 周视图（近 7 天） */
  .habit-week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .hweek-day{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px 7px;border-radius:11px;cursor:pointer;border:1px solid var(--line);background:var(--card);transition:border-color .15s,box-shadow .15s;}
  .hweek-day:hover{border-color:var(--item-hbd);}
  .hweek-day.today{border-color:var(--coral);box-shadow:0 0 0 2px rgba(var(--acc-rgb),.14);}
  .hweek-day .wd{font-size:11px;color:var(--sub);}
  .hweek-day .wn{font-size:15px;font-weight:700;}
  .hweek-dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:700;}
  /* 年视图（全年热力图） */
  .habit-year{display:flex;gap:2.5px;overflow-x:auto;padding:2px 2px 6px;}
  .hyear-col{display:flex;flex-direction:column;gap:2.5px;flex:0 0 auto;}
  .hyear-cell{width:11px;height:11px;border-radius:2.5px;background:var(--line);cursor:pointer;transition:transform .1s;}
  .hyear-cell:hover{transform:scale(1.25);}
  .hyear-cell.dim{opacity:.28;cursor:default;}
  .hyear-cell.dim:hover{transform:none;}
  .habits{display:flex;flex-direction:column;gap:9px;}
  .habit{display:flex;align-items:center;gap:11px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;}
  .habit .name{font-weight:600;flex:1;}
  .streak{font-size:12px;color:var(--sub);}
  .fire{color:#FF8A3D;}
  /* Toolbar */
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .toolbar .ic-btn{flex:1;min-width:120px;}
  .filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .filter-bar select,.filter-bar input{flex:1;min-width:110px;}
  /* 记账模板快捷条 */
  .tpl-chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:3px;margin-bottom:11px;}
  .tpl-chips:empty{display:none;}
  .tpl-chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;
    padding:6px 11px;font-size:12px;font-weight:600;color:var(--ink);cursor:pointer;font-family:inherit;
    display:flex;align-items:center;gap:5px;transition:background .15s,border-color .15s;}
  .tpl-chip small{color:var(--coral-d);font-weight:700;}
  .tpl-chip:hover{border-color:var(--item-hbd);background:var(--item-hbg);}
  .tpl-chip:active{background:var(--accent-soft);}
  /* 模板行「快速记一笔」按钮 */
  .tpl-add{border:none;background:rgba(var(--acc-rgb),.12);color:var(--coral-d);font-size:17px;font-weight:700;
    cursor:pointer;flex:0 0 auto;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
    padding:0;min-height:34px;line-height:1;transition:background .15s;}
  .tpl-add:hover{background:rgba(var(--acc-rgb),.22);}
  .tpl-add:active{background:rgba(var(--acc-rgb),.30);}
  .warn{background:#FFF6E5;border:1px solid #FFE2A8;color:#B5760A;font-size:13px;padding:10px 12px;border-radius:11px;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
  .banner-top{background:var(--banner-bg);border:1px solid var(--banner-bd);color:var(--coral-d);font-size:13px;padding:9px 14px;margin:10px auto 0;max-width:880px;border-radius:11px;text-align:center;}
  /* Modal */
  .mask{position:fixed;inset:0;background:rgba(20,20,30,.45);display:none;align-items:center;justify-content:center;z-index:60;padding:18px;}
  .mask.show{display:flex;}
  .modal{background:#fff;border-radius:18px;padding:18px;width:100%;max-width:380px;max-height:86vh;overflow:auto;}
  .modal h3{margin:0 0 12px;font-size:17px;}
  .modal .btn-primary{margin-top:10px;}
  /* 今日待处理弹框 */
  .modal-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;}
  .modal-h h3{margin:0;display:flex;align-items:center;gap:8px;font-size:17px;}
  .modal-h .badge{background:var(--coral-l);color:var(--coral-d);font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;}
  .modal-x{border:none;background:var(--coral-l);color:var(--coral-d);font-weight:600;font-size:13px;
    padding:6px 12px;border-radius:9px;cursor:pointer;min-height:34px;flex:0 0 auto;font-family:inherit;}
  .modal-x:active{background:var(--accent-soft);}
  .modal .today-list{max-height:min(58vh,380px);padding:0;}
  /* ============ 布局：应用列（顶栏 + 内容）随左侧抽屉收缩而让位 ============ */
  .app{margin-left:var(--drawer-w);transition:margin-left .22s cubic-bezier(.2,.8,.25,1);}
  .drawer.collapsed ~ .app{margin-left:var(--drawer-w-collapsed);}

  /* 背景装饰层（为毛玻璃提供透出质感） */
  .bg-deco{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
    radial-gradient(480px 480px at 6% 14%, rgba(var(--acc-rgb),.20), transparent 62%),
    radial-gradient(480px 480px at 1% 95%, rgba(91,141,239,.15), transparent 62%);}

  /* ---------- 底部导航（移动端固定） ---------- */
  .bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -2px 14px rgba(0,0,0,.05);}
  .bottom-nav button{flex:1;border:none;background:transparent;color:var(--sub);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px 0;min-height:44px;justify-content:center;position:relative;}
  .bottom-nav button svg{width:22px;height:22px;}
  .bottom-nav button.active{color:var(--coral-d);}
  .bottom-nav button.active::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
    width:24px;height:3px;border-radius:0 0 3px 3px;background:var(--coral);}

  /* ---------- 遮罩（移动端抽屉覆盖层） ---------- */
  .scrim{position:fixed;inset:0;background:rgba(20,20,30,.40);backdrop-filter:blur(2px);z-index:40;opacity:0;pointer-events:none;transition:opacity .22s;}
  .scrim.show{opacity:1;pointer-events:auto;}

  /* ---------- 左侧抽屉导航（桌面固定可收缩；移动端覆盖抽屉） ---------- */
  .drawer{position:fixed;top:0;bottom:0;left:0;width:var(--drawer-w);z-index:45;
    display:flex;flex-direction:column;padding:16px 12px;
    background:rgba(255,255,255,.72);backdrop-filter:blur(18px) saturate(160%);
    -webkit-backdrop-filter:blur(18px) saturate(160%);
    border-right:1px solid rgba(255,255,255,.6);box-shadow:2px 0 22px rgba(40,40,60,.07);
    transition:transform .24s cubic-bezier(.2,.8,.25,1),width .22s cubic-bezier(.2,.8,.25,1);
    overflow-y:auto;}
  .drawer-logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;color:var(--coral-d);padding:6px 8px 16px;min-height:48px;}
  .drawer-logo svg{width:26px;height:26px;flex:0 0 auto;}
  .drawer-logo .dl-txt{white-space:nowrap;overflow:hidden;}
  .drawer-collapse{flex:0 0 auto;margin-left:auto;width:30px;height:30px;border:none;background:rgba(var(--acc-rgb),.12);color:var(--coral-d);border-radius:9px;cursor:pointer;display:grid;place-items:center;transition:transform .2s,background .15s;}
  .drawer-collapse:active{background:rgba(var(--acc-rgb),.24);}
  .drawer-collapse svg{width:18px;height:18px;}
  .drawer-nav{display:flex;flex-direction:column;gap:6px;}
  .drawer-item{display:flex;align-items:center;gap:13px;padding:12px 14px;border:none;background:transparent;
    color:var(--sub);font-size:15px;font-weight:600;border-radius:13px;cursor:pointer;text-align:left;
    transition:background .15s,color .15s;font-family:inherit;width:100%;white-space:nowrap;overflow:hidden;}
  .drawer-item svg{width:21px;height:21px;flex:0 0 auto;stroke:currentColor;}
  .drawer-item .di-label{transition:opacity .15s;}
  .drawer-item:hover{background:rgba(var(--acc-rgb),.10);color:var(--coral-d);}
  .drawer-item.active{background:linear-gradient(135deg,var(--coral),var(--accent-2));color:#fff;box-shadow:0 8px 18px rgba(var(--acc-rgb),.32);}
  .drawer-item.danger{color:#C9403C;}
  .drawer-item.danger:hover{background:rgba(217,83,79,.10);color:#C9403C;}

  /* ---------- 抽屉工具入口：云端服务 / 数据备份 / 清空数据（点击弹框） ---------- */
  .drawer-tools{margin-top:14px;padding:12px 4px 0;border-top:1px solid rgba(0,0,0,.06);display:flex;flex-direction:column;gap:6px;}
  .drawer-tools .drawer-item{padding:11px 12px;}
  .di-label em{display:block;font-style:normal;font-size:11px;font-weight:500;color:var(--sub);margin-top:1px;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .db-actions{display:grid;gap:6px;}
  .db-btn{border:none;background:rgba(var(--acc-rgb),.10);color:var(--coral-d);font-size:13px;font-weight:600;
    padding:9px 11px;border-radius:10px;cursor:pointer;font-family:inherit;text-align:left;min-height:38px;
    transition:background .15s;}
  .db-btn:hover{background:rgba(var(--acc-rgb),.18);}
  .db-btn:active{background:rgba(var(--acc-rgb),.26);}
  .db-btn.danger{background:rgba(217,83,79,.09);color:#C9403C;}
  .db-btn.danger:hover{background:rgba(217,83,79,.16);}
  .db-title{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--sub);margin-bottom:9px;letter-spacing:.3px;}
  .db-title svg{width:15px;height:15px;flex:0 0 auto;opacity:.7;}

  /* 抽屉内「主题切换」区 */
  .drawer-theme{margin-top:14px;padding:12px 8px 0;border-top:1px solid rgba(0,0,0,.06);}
  .theme-row{display:flex;gap:7px;}
  .theme-sw{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 2px 7px;
    border:1px solid var(--line);border-radius:11px;background:var(--card);cursor:pointer;font-family:inherit;
    transition:border-color .15s,box-shadow .15s,transform .1s;}
  .theme-sw:active{transform:scale(.95);}
  .theme-sw span{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.55),0 1px 4px rgba(0,0,0,.12);}
  .theme-sw i{font-style:normal;font-size:11px;font-weight:600;color:var(--sub);}
  .theme-sw.on{border-color:var(--coral);box-shadow:0 0 0 2px rgba(var(--acc-rgb),.16);}
  .theme-sw.on i{color:var(--coral-d);}

  /* 「云端服务」弹框内账户行（.da-* 供弹框复用） */
  .da-user{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .da-avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--coral),var(--accent-2));color:#fff;font-weight:800;font-size:16px;display:grid;place-items:center;flex:0 0 auto;}
  .da-info{flex:1;min-width:0;}
  .da-name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .da-sub{font-size:11px;color:var(--sub);}

  /* 桌面收缩态：折叠为仅图标栏 */
  .drawer.collapsed{width:var(--drawer-w-collapsed);padding-left:10px;padding-right:10px;}
  .drawer.collapsed .dl-txt,
  .drawer.collapsed .di-label,
  .drawer.collapsed .drawer-theme{display:none;}
  .drawer.collapsed .drawer-logo{flex-direction:column;justify-content:center;gap:6px;padding:6px 0 12px;}
  .drawer.collapsed .drawer-item{justify-content:center;padding:13px 0;gap:0;}

  /* 顶部 tabs 已弃用，统一隐藏（桌面用抽屉、手机用底部导航） */
  .tabs{display:none;}

  /* ---------- 桌面：抽屉固定展示，可收缩；隐藏底部导航 ---------- */
  @media(min-width:760px){
    .bottom-nav{display:none;}
    body{padding-bottom:18px;}
    /* 桌面抽屉常驻，顶栏汉堡无意义（收缩 / 展开用抽屉内按钮），隐藏 */
    #navToggle{display:none;}
  }
  /* ---------- 移动：抽屉为覆盖层（抽屉式），底部导航固定 ---------- */
  @media(max-width:759px){
    .app{margin-left:0;}
    .drawer{transform:translateX(-104%);width:var(--drawer-w);}
    .drawer.show{transform:translateX(0);}
    .drawer.collapsed{width:var(--drawer-w);}
    .drawer.collapsed .dl-txt,
    .drawer.collapsed .di-label,
    .drawer.collapsed .drawer-collapse{display:revert;}
    .bottom-nav{display:flex;}
    body{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));}
    .drawer-collapse{display:none;}
  }
  /* 小屏适配：收紧间距，保证底部导航触控舒适 */
  @media(max-width:480px){
    .wrap{padding:10px 10px 0;}
    .card{padding:14px;margin-bottom:12px;}
    .bottom-nav button{font-size:10px;}
    .bottom-nav button svg{width:20px;height:20px;}
    .stats{gap:8px;}
    /* 顶栏：logo 与「本地存储」胶囊收窄，给今日图标留位 */
    .head-row{gap:8px;}
    .logo{font-size:16px;gap:6px;}
    .logo svg{width:20px;height:20px;}
    .sync{font-size:11px;padding:4px 8px;}
    .sync .dot{width:7px;height:7px;}
  }
  @media(max-width:360px){
    .logo span,.logo{white-space:nowrap;}
    .sync #syncText{display:none;}
    .sync{padding:6px;gap:0;}
  }

  /* ============================================================
     UI 打磨：动效、焦点态、悬浮反馈、滚动条、渐变数值
     ============================================================ */
  /* 1) 弹框入场动画（淡入 + 轻微上浮缩放，keyframes 保证 display 切换也生效） */
  .mask.show{animation:maskIn .18s ease;}
  @keyframes maskIn{from{opacity:0;}to{opacity:1;}}
  .mask .modal{will-change:transform,opacity;}
  .mask.show .modal{animation:modalIn .24s cubic-bezier(.2,.8,.25,1);}
  @keyframes modalIn{from{opacity:0;transform:translateY(14px) scale(.97);}to{opacity:1;transform:none;}}
  /* 2) 模块切换淡入 */
  .sec.active{animation:secIn .24s cubic-bezier(.2,.8,.25,1);}
  @keyframes secIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  @media(prefers-reduced-motion:reduce){
    .sec.active{animation:none;}
    .mask.show,.mask.show .modal{animation:none;}
    .app,.drawer{transition:none;}
  }
  /* 3) 卡片悬浮微反馈（仅桌面指针设备） */
  @media(hover:hover) and (min-width:760px){
    .card{transition:transform .18s ease,box-shadow .18s ease;}
    .card:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(40,40,60,.10);}
    .stat{transition:transform .18s ease,box-shadow .18s ease;}
    .stat:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(var(--acc-rgb),.16);}
    .btn-primary{transition:background .15s,transform .1s,box-shadow .15s;}
    .btn-primary:hover{background:var(--accent-hover);box-shadow:0 8px 20px rgba(var(--acc-rgb),.30);}
    .btn-primary:active{transform:scale(.985);}
    .add-ic:hover,.ic-btn:hover{background:var(--accent-soft);}
    .db-btn{transition:background .15s,transform .1s;}
    .db-btn:active{transform:scale(.985);}
  }
  /* 4) 表单焦点环（珊瑚橙柔和光圈） */
  input:focus-visible,select:focus-visible,textarea:focus-visible{
    outline:none;border-color:var(--coral);box-shadow:0 0 0 3px rgba(var(--acc-rgb),.16);
  }
  .seg button{transition:background .15s,color .15s;}
  .menu-btn,.today-btn{transition:background .15s,transform .1s;}
  .menu-btn:hover{background:rgba(255,255,255,.30);}
  .today-btn:hover{background:rgba(255,255,255,.30);}
  .today-btn:active{transform:scale(.94);}
  .modal-x:hover{background:var(--accent-soft);}
  /* 5) 统计数值：渐变字 + 等宽数字 */
  .stat .v{
    background:linear-gradient(135deg,var(--coral-d),var(--accent-2));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    font-variant-numeric:tabular-nums;letter-spacing:-.3px;
  }
  .amt-in,.amt-out{font-variant-numeric:tabular-nums;}
  /* 6) 细滚动条（珊瑚橙点缀） */
  *{scrollbar-width:thin;scrollbar-color:var(--scroll) transparent;}
  ::-webkit-scrollbar{width:6px;height:6px;}
  ::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:999px;}
  ::-webkit-scrollbar-thumb:hover{background:var(--scroll-h);}
  ::-webkit-scrollbar-track{background:transparent;}
  /* 7) toast 上滑入场 */
  #wbToast{transform:translateX(-50%) translateY(8px) !important;opacity:0;}
  #wbToast.on{transform:translateX(-50%) translateY(0) !important;opacity:1 !important;}
  /* 8) 底部导航 active 图标轻微上浮 */
  .bottom-nav button{transition:color .15s;}
  .bottom-nav button svg{transition:transform .18s cubic-bezier(.2,.8,.25,1);}
  .bottom-nav button.active svg{transform:translateY(-2px);}
  /* 9) 抽屉项按压反馈 */
  .drawer-item:active{transform:scale(.985);}
  .drawer-item{transition:background .15s,color .15s,transform .1s;}
  /* 10) 空状态更精致 */
  .empty,.t-empty{padding:26px 0;font-size:13.5px;opacity:.85;}
  /* 11) 列表项 hover（桌面） */
  @media(hover:hover) and (min-width:760px){
    .item:hover,.habit:hover{border-color:var(--item-hbd);background:var(--item-hbg);}
  }
</style>
</head>
<body>
<div class="bg-deco"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-logo">
    <span class="dl-txt">全能工作台</span>
    <button class="drawer-collapse" id="navCollapse" aria-label="收起 / 展开侧边导航" title="收起 / 展开导航">
      <svg viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
  <nav class="drawer-nav">
    <button class="drawer-item active" data-tab="account">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M9 12h6M12 9v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span class="di-label">记账</span>
    </button>
    <button class="drawer-item" data-tab="habit">
      <svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="di-label">习惯</span>
    </button>
    <button class="drawer-item" data-tab="todo">
      <svg viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" rx="3" stroke="currentColor" stroke-width="2"/><path d="M8 12l3 3 5-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="di-label">待办</span>
    </button>
    <button class="drawer-item" data-tab="fit">
      <svg viewBox="0 0 24 24" fill="none"><path d="M6 12l3-6 3 4 3-8 3 10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="di-label">减脂</span>
    </button>
  </nav>

  <!-- 主题切换（珊瑚橙 / 绿 / 蓝） -->
  <div class="drawer-theme">
    <div class="db-title">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.9"/><path d="M12 3a9 9 0 0 0 0 18Z" fill="currentColor" opacity=".85"/></svg>
      <span>主题</span>
    </div>
    <div class="theme-row" id="themeRow">
      <button class="theme-sw on" data-theme="" title="珊瑚橙主题">
        <span style="background:#FF7A59"></span><i>珊瑚</i>
      </button>
      <button class="theme-sw" data-theme="green" title="清新绿主题">
        <span style="background:#27AE60"></span><i>清新绿</i>
      </button>
      <button class="theme-sw" data-theme="blue" title="天空蓝主题">
        <span style="background:#3E8BFF"></span><i>天空蓝</i>
      </button>
    </div>
  </div>

  <!-- 工具入口：点击弹框（云端服务 / 数据备份 / 清空数据） -->
  <div class="drawer-tools">
    <button class="drawer-item" id="menuCloud">
      <svg viewBox="0 0 24 24" fill="none"><path d="M7 18a4.5 4.5 0 1 1 .9-8.9 5.5 5.5 0 0 1 10.6 1.6A3.7 3.7 0 0 1 17.8 18Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      <span class="di-label">云端服务<em id="cloudRowSub">检测中…</em></span>
    </button>
    <button class="drawer-item" id="menuBackup">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 7a8 3 0 1 0 16 0A8 3 0 1 0 4 7" stroke="currentColor" stroke-width="1.9"/><path d="M4 7v10c0 1.7 3.6 3 8 3s8-1.3 8-3V7" stroke="currentColor" stroke-width="1.9"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3" stroke="currentColor" stroke-width="1.9"/></svg>
      <span class="di-label">数据备份</span>
    </button>
    <button class="drawer-item danger" id="menuClear">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V5a1.5 1.5 0 0 1 1.5-1.5h3A1.5 1.5 0 0 1 15 5v2M6.5 7l.8 12a2 2 0 0 0 2 1.9h5.4a2 2 0 0 0 2-1.9l.8-12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="di-label">清空数据</span>
    </button>
  </div>
  <input type="file" id="fileInput" accept="application/json" style="display:none">
</aside>

<div class="scrim" id="scrim"></div>

<div class="app">
<header>
  <div class="head-row">
    <button class="menu-btn" id="navToggle" aria-label="打开导航" aria-expanded="false" title="菜单">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
    <div class="logo">全能工作台</div>
    <div class="spacer"></div>
    <button class="menu-btn today-btn" id="todayBtn" aria-label="今天要处理" title="今天要处理">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M12 7.5v4.8l3.4 2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 3v1.4M21 12h-1.4M12 21v-1.4M3 12h1.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" opacity=".55"/></svg>
      <span class="today-badge" id="todayBadge" hidden>0</span>
    </button>
    <div class="sync"><span class="dot"></span><span id="syncText">本地存储</span></div>
  </div>
</header>

<div class="banner-top" id="offlineBanner" style="display:none">⚠️ 离线模式：操作已暂存本地，联网后将自动同步</div>

<div class="wrap">
  <!-- PC tabs -->
  <div class="tabs" id="pcTabs">
    <button class="tab active" data-tab="account"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M9 12h6M12 9v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>记账</button>
    <button class="tab" data-tab="habit"><svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>习惯</button>
    <button class="tab" data-tab="todo"><svg viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" rx="3" stroke="currentColor" stroke-width="2"/><path d="M8 12l3 3 5-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>待办</button>
    <button class="tab" data-tab="fit"><svg viewBox="0 0 24 24" fill="none"><path d="M6 12l3-6 3 4 3-8 3 10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>减脂</button>
  </div>

  <!-- 记账 -->
  <section class="sec active" id="sec-account">
    <div class="card">
      <div class="card-h"><h3>📊 本月概览</h3><span class="sub" id="accMonth"></span><button class="ic-btn" id="accEditBudget" style="min-height:34px;padding:5px 12px;">预算</button></div>
      <div class="chart-row">
        <div id="budgetRing"></div>
        <div id="pieChart" style="flex:1;min-width:160px;"></div>
      </div>
      <div class="stats" style="margin-top:12px;">
        <div class="stat"><div class="v" id="stIncome">¥0</div><div class="k">本月收入</div></div>
        <div class="stat"><div class="v" id="stExpense">¥0</div><div class="k">本月支出</div></div>
        <div class="stat"><div class="v" id="stBalance">¥0</div><div class="k">结余</div></div>
        <div class="stat"><div class="v" id="stBudgetLeft">¥0</div><div class="k">预算剩余</div></div>
      </div>
    </div>
    <div class="card">
      <div class="card-h"><h3>📈 统计分析</h3>
        <div class="seg" id="statsSeg" style="padding:3px;">
          <button data-v="trend" class="on">趋势</button>
          <button data-v="rank">分类排行</button>
        </div>
      </div>
      <div class="seg" id="statsPeriodSeg" style="padding:3px;margin:2px 0 12px;">
        <button data-v="day">日</button>
        <button data-v="week">周</button>
        <button data-v="month" class="on">月</button>
        <button data-v="year">年</button>
      </div>
      <div id="statsBox"></div>
    </div>
    <div class="card">
      <div class="card-h"><h3>📜 最近记录</h3>
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="sub" id="accTotal"></span>
          <button class="ic-btn" id="tplMgr" style="min-height:34px;padding:5px 10px;" title="管理记账模板">模板</button>

          </button>

      </div>
      <div class="filter-bar" id="accFilterBar">
        <select id="accFMonth"><option value="">全部分月</option></select>
        <select id="accFCat"><option value="">全部分类</option></select>
        <input type="text" id="accFKey" placeholder="搜索备注/分类">
      </div>
      <div class="list" id="accList"></div>
    </div>
  </section>

  <!-- 习惯 -->
  <section class="sec" id="sec-habit">
    <div class="card">
      <div class="card-h"><h3>📅 打卡日历</h3>
        <div style="display:flex;align-items:center;gap:10px;">
          <span class="sub" id="habitMonth"></span>
          <div class="seg" id="calViewSeg" style="padding:3px;">
            <button data-v="month" class="on">月</button>
            <button data-v="week">周</button>
            <button data-v="year">年</button>
          </div>
        </div>
      </div>
      <div class="habit-grid" id="habitCalHead"></div>
      <div class="habit-grid" id="habitCal"></div>
      <div style="font-size:12px;color:var(--sub);margin-top:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
        <span>强度：</span>

          <span style="width:12px;height:12px;border-radius:3px;background:var(--line);display:inline-block;"></span>0
          <span style="width:12px;height:12px;border-radius:3px;background:var(--heat1);display:inline-block;"></span>1
          <span style="width:12px;height:12px;border-radius:3px;background:var(--heat2);display:inline-block;"></span>2-3
          <span style="width:12px;height:12px;border-radius:3px;background:var(--coral);display:inline-block;"></span>全勤
        </span>

    </div>
    <div class="card">
      <div class="card-h"><h3>✅ 我的习惯</h3>

          <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="habits" id="habitList"></div>
    </div>
  </section>

  <!-- 待办 -->
  <section class="sec" id="sec-todo">
    <div class="card">
      <div class="card-h"><h3>📋 待办清单</h3>
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="sub" id="todoRate">点击圆圈完成</span>
          <button class="ic-btn" id="todoArchBtn" style="min-height:34px;padding:5px 10px;display:none;" title="查看已归档待办">📦 归档 <b id="archCount">0</b></button>
          <button class="add-ic" id="todoAddBtn" aria-label="添加待办" title="添加待办">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>

  <!-- 减脂 -->
  <section class="sec" id="sec-fit">
    <div class="card">
      <div class="card-h"><h3>📈 体重 / 体脂趋势</h3><span class="sub" id="fitCount"></span></div>
      <div id="fitChart" style="width:100%;overflow-x:auto;"></div>
    </div>

<script>
/* ============ 数据层 ============ */
const PREFIX="wb_allin_";
const KEYS={todos:PREFIX+"todos",accounts:PREFIX+"accounts",habits:PREFIX+"habits",fitness:PREFIX+"fitness",budget:PREFIX+"budget",seeded:PREFIX+"seeded",templates:PREFIX+"templates",snapshots:PREFIX+"snapshots"};
const CAT_EXPENSE=[["餐饮","#FF7A59"],["交通","#5B8DEF"],["购物","#9B6DFF"],["居住","#27AE60"],["娱乐","#F2B705"],["医疗","#E8453C"],["其他","#8A8A95"]];
const CAT_INCOME=[["工资","#27AE60"],["兼职","#5B8DEF"],["理财","#9B6DFF"],["红包","#FF7A59"],["其他","#8A8A95"]];
const HABIT_COLORS=["#FF7A59","#5B8DEF","#27AE60","#9B6DFF","#F2B705","#E8453C"];
let state={todos:[],accounts:[],habits:[],fitness:[],budget:3000,seeded:false,templates:[]};

function loadAll(){
  try{
    state.todos=JSON.parse(localStorage.getItem(KEYS.todos)||"[]");
    state.accounts=JSON.parse(localStorage.getItem(KEYS.accounts)||"[]");
    state.habits=JSON.parse(localStorage.getItem(KEYS.habits)||"[]");
    state.fitness=JSON.parse(localStorage.getItem(KEYS.fitness)||"[]");
    state.templates=JSON.parse(localStorage.getItem(KEYS.templates)||"[]");
    const b=localStorage.getItem(KEYS.budget); if(b!==null) state.budget=Number(b);
    state.seeded=localStorage.getItem(KEYS.seeded)==="1";
    migrateLegacy();
  }catch(e){ console.warn("load err",e); }
}
// 旧版本数据迁移：accounts 曾用 cat 字段存分类（导致列表/统计/编辑丢失分类），统一归一到 category
function migrateLegacy(){
  let fixed=0;
  (state.accounts||[]).forEach(a=>{
    if(a.cat!==undefined && a.category===undefined){ a.category=a.cat||"其他"; fixed++; }
    if(a.category===undefined){ a.category="其他"; fixed++; }
    delete a.cat;
  });
  (state.templates||[]).forEach(t=>{
    if(t.category===undefined){ t.category=t.cat||"其他"; fixed++; }
    delete t.cat;
  });
  if(fixed){ try{ localStorage.setItem(KEYS.accounts,JSON.stringify(state.accounts)); localStorage.setItem(KEYS.templates,JSON.stringify(state.templates)); }catch(e){} }
}
function save(){
  localStorage.setItem(KEYS.todos,JSON.stringify(state.todos));
  localStorage.setItem(KEYS.accounts,JSON.stringify(state.accounts));
  localStorage.setItem(KEYS.habits,JSON.stringify(state.habits));
  localStorage.setItem(KEYS.fitness,JSON.stringify(state.fitness));
  localStorage.setItem(KEYS.templates,JSON.stringify(state.templates||[]));
  localStorage.setItem(KEYS.budget,String(state.budget));
  localStorage.setItem(KEYS.seeded,state.seeded?"1":"0");
  checkBackupHint();
  scheduleCloudPush();
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

/* ============ 本地快照（最多 3 份 · 拉云端/恢复前自动备份） ============ */
const SNAP_MAX=5;
function getSnaps(){ try{ return JSON.parse(localStorage.getItem(KEYS.snapshots)||"[]"); }catch(e){ return []; } }
function snapPayload(){ return JSON.parse(JSON.stringify({todos:state.todos,accounts:state.accounts,habits:state.habits,fitness:state.fitness,templates:state.templates||[],budget:state.budget,seeded:state.seeded})); }
function snapCount(d){ return (d.todos?d.todos.length:0)+(d.accounts?d.accounts.length:0)+(d.habits?d.habits.length:0)+(d.fitness?d.fitness.length:0); }
function takeSnapshot(reason){
  const snaps=getSnaps();
  const data=snapPayload();
  snaps.unshift({id:uid(),ts:Date.now(),reason:reason||"手动快照",count:snapCount(data),data});
  const kept=snaps.slice(0,SNAP_MAX);
  try{ localStorage.setItem(KEYS.snapshots,JSON.stringify(kept)); }
  catch(e){ toast("快照保存失败：本机存储空间不足",true); return null; }
  return kept;
}
function fmtSnapTime(ts){ const d=new Date(ts); return dstr(d)+" "+pad(d.getHours())+":"+pad(d.getMinutes()); }
function restoreSnapshot(id){
  const s=getSnaps().find(x=>x.id===id); if(!s) return;
  confirmModal({
    title:"恢复快照",
    msg:"将用 <b>"+fmtSnapTime(s.ts)+"</b>（"+esc(s.reason)+"，"+s.count+" 条记录）的快照<b>覆盖当前全部数据</b>。确定继续？",
    okText:"恢复",
    onOk:()=>{
      state=Object.assign({todos:[],accounts:[],habits:[],fitness:[],templates:[],budget:3000,seeded:true},JSON.parse(JSON.stringify(s.data||{})));
      save();refreshAll();closeModal();
      toast("已恢复到快照 ✓"); openSnapModal();
    }
  });
}
function openSnapModal(){
  const box=document.getElementById("modalBox");
  const snaps=getSnaps();
  box.innerHTML=`
    <div class="modal-h"><h3>📸 本地快照</h3><button class="modal-x" id="mSnapClose" aria-label="关闭">关闭</button></div>
    <p style="font-size:12.5px;color:var(--sub);margin:0 0 10px;">快照保存在本机浏览器，最多保留 ${SNAP_MAX} 份（新的会挤掉最旧的）。<b>拉取云端数据前会自动备份一份</b>，数据被覆盖时可在这里找回。</p>
    <button class="btn-primary" id="mSnapNow" style="margin-top:0;">立即拍摄快照</button>
    ${snaps.length?('<div class="list" style="margin-top:11px;">'+snaps.map(s=>`
      <div class="item">
        <div class="body">
          <div class="t1">${fmtSnapTime(s.ts)}</div>
          <div class="t2"><span>${esc(s.reason)} · ${s.count} 条记录</span></div>
        </div>
        <div style="display:flex;gap:6px;">
          <button class="db-btn" data-snapres="${s.id}" style="min-height:34px;padding:6px 10px;">恢复</button>
          <button class="del" data-snapdel="${s.id}">✕</button>
        </div>
      </div>`).join("")+'</div>'):'<div class="empty" style="margin-top:11px;">还没有快照。可手动拍摄，或等拉取云端数据时自动生成</div>'}`;
  document.getElementById("mSnapClose").addEventListener("click",closeModal);
  document.getElementById("mSnapNow").addEventListener("click",()=>{
    if(takeSnapshot("手动快照")){ toast("快照已保存 ✓"); openSnapModal(); }
  });
  box.querySelectorAll("[data-snapres]").forEach(b=>b.addEventListener("click",()=>restoreSnapshot(b.dataset.snapres)));
  box.querySelectorAll("[data-snapdel]").forEach(b=>b.addEventListener("click",()=>{
    confirmModal({title:"删除快照",msg:"删除后无法找回，确定？",okText:"删除",danger:true,onOk:()=>{
      const kept=getSnaps().filter(x=>x.id!==b.dataset.snapdel);
      localStorage.setItem(KEYS.snapshots,JSON.stringify(kept));
      openSnapModal(); toast("已删除快照");
    }});
  }));
  openModal();
}

/* ============ 日期工具 ============ */
function pad(n){return n<10?"0"+n:""+n;}
function dstr(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function todayStr(){return dstr(new Date());}
function parseD(s){const p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function addDays(s,n){const d=parseD(s);d.setDate(d.getDate()+n);return dstr(d);}
function monthOf(s){return s.slice(0,7);}
function daysInMonth(y,m){return new Date(y,m,0).getDate();}
function weekday(y,m,d){return new Date(y,m-1,d).getDay();}

/* ============ 示例数据 ============ */
function seed(){
  if(state.seeded) return;
  const t=todayStr(),y=addDays(t,-1),tm=addDays(t,1),ym=addDays(t,-2);
  state.todos=[
    {id:uid(),title:"补交上月工作日报",date:y,priority:"P1",done:false},

    {id:uid(),type:"income",amount:8000,category:"工资",note:"月薪",date:t.slice(0,8)+"05"},
    {id:uid(),type:"expense",amount:38,category:"餐饮",note:"午餐",date:addDays(t,-1)},
    {id:uid(),type:"expense",amount:12,category:"交通",note:"地铁",date:addDays(t,-1)},
    {id:uid(),type:"expense",amount:199,category:"购物",note:"日用品",date:addDays(t,-3)},
    {id:uid(),type:"expense",amount:25,category:"餐饮",note:"早餐",date:t}
  ];
  const rec={};
  [ym,y,addDays(t,-4),addDays(t,-5)].forEach(d=>{rec[d]=true;});
  state.habits=[
    {id:uid(),name:"早起",color:HABIT_COLORS[0],records:Object.assign({},rec)},
    {id:uid(),name:"读书",color:HABIT_COLORS[1],records:Object.assign({},rec)},
    {id:uid(),name:"运动",color:HABIT_COLORS[2],records:{[ym]:true}},

  state.fitness=[
    {id:uid(),date:addDays(t,-14),weight:62.5,fat:22.1,note:"开始记录"},

    {id:uid(),date:addDays(t,-2),weight:61.2,fat:21.0,note:"控制饮食"}

/* ============ 渲染层（单向：数据→计算→渲染，统一入口 refreshAll） ============ */
function refreshAll(){
  renderToday(); renderAccounting(); renderHabits(); renderTodos(); renderFitness();
  checkBackupHint();
}

/* 今天要处理（顶栏图标 → 弹框） */
function todayItems(){
  const t=todayStr();
  const items=[];
  // 待办：逾期 + 今天未完成
  state.todos.filter(x=>!x.done && x.date<=t).sort((a,b)=> (a.date<b.date?-1:1)).forEach(x=>{
    const overdue=x.date<t;
    items.push({type:"todo",id:x.id,title:x.title,meta:(overdue?"逾期 · ":"今天 · ")+x.priority,overdue:overdue,ic:"M5 13l4 4L19 7"});
  });
  // 习惯：今天未打卡
  state.habits.forEach(h=>{
    if(!h.records[t]){
      items.push({type:"habit",id:h.id,title:"打卡「"+h.name+"」",meta:"今日待完成",overdue:false,ic:"M12 6v6l4 2"});
    }
  });
  return items;
}
function todayListHTML(items){
  if(items.length===0) return '<div class="t-empty">🎉 今天没有待处理事项，轻松一下！</div>';
  return items.map(it=>`
    <div class="t-item ${it.overdue?'t-overdue':''}">
      <div class="t-ic"><svg viewBox="0 0 24 24" fill="none"><path d="${it.ic}" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="t-main"><div class="t-title">${esc(it.title)}</div><div class="t-meta">${esc(it.meta)}</div></div>
      <button class="t-btn" data-act="${it.type}" data-id="${it.id}">完成</button>
    </div>`).join("");
}
function renderToday(){
  const items=todayItems();
  // 顶栏角标
  const badge=document.getElementById("todayBadge");
  if(badge){ badge.textContent=items.length; badge.hidden=items.length===0; }
  // 弹框内容（打开时同步刷新）
  const list=document.getElementById("todayModalList");
  if(list) list.innerHTML=todayListHTML(items);
  const cnt=document.getElementById("todayModalCount");
  if(cnt) cnt.textContent=items.length;
}
function openTodayModal(){
  const box=document.getElementById("modalBox");
  box.innerHTML=`
    <div class="modal-h">
      <h3>⏰ 今天要处理 <span class="badge" id="todayModalCount">0</span></h3>
      <button class="modal-x" id="todayModalClose" aria-label="关闭">关闭</button>
    </div>
    <div class="today-list" id="todayModalList"></div>`;
  box.querySelector("#todayModalClose").addEventListener("click",closeModal);
  box.querySelector("#todayModalList").addEventListener("click",e=>{
    const b=e.target.closest(".t-btn"); if(b) handleToday(b.dataset.act,b.dataset.id);
  });
  openModal();
  renderToday();
}
function handleToday(act,id){
  const t=todayStr();
  if(act==="todo"){const x=state.todos.find(z=>z.id===id);if(x){x.done=true;save();}}
  else if(act==="habit"){const h=state.habits.find(z=>z.id===id);if(h){h.records[t]=true;save();}}
  refreshAll();
}

/* 记账 */
function catColor(type,cat){const arr=type==="income"?CAT_INCOME:CAT_EXPENSE;const f=arr.find(c=>c[0]===cat);return f?f[1]:"#8A8A95";}
function renderAccounting(){
  const m=monthOf(todayStr());
  document.getElementById("accMonth").textContent=m.replace("-","年")+"月";
  const list=state.accounts.filter(a=>monthOf(a.date)===m);
  const income=list.filter(a=>a.type==="income").reduce((s,a)=>s+a.amount,0);
  const expense=list.filter(a=>a.type==="expense").reduce((s,a)=>s+a.amount,0);
  const balance=income-expense;
  const left=state.budget-expense;
  document.getElementById("stIncome").textContent="¥"+fmt(income);
  document.getElementById("stExpense").textContent="¥"+fmt(expense);
  document.getElementById("stBalance").textContent="¥"+fmt(balance);
  const leftEl=document.getElementById("stBudgetLeft");
  leftEl.textContent="¥"+fmt(left); leftEl.style.color=left<0?"var(--red)":"var(--coral-d)";
  // 预算环
  const pct=state.budget>0?Math.min(100,expense/state.budget*100):0;
  document.getElementById("budgetRing").innerHTML=ring(pct,state.budget,expense);
  // 支出饼图
  const byCat={};
  list.filter(a=>a.type==="expense").forEach(a=>{byCat[a.category]=(byCat[a.category]||0)+a.amount;});
  const entries=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  document.getElementById("pieChart").innerHTML=entries.length?pie(entries):'<div class="empty">本月暂无支出</div>';
  // 列表（支持按月份/分类/关键字筛选）
  const fMonth=document.getElementById("accFMonth"),fCat=document.getElementById("accFCat"),fKey=document.getElementById("accFKey");
  const curMonth=fMonth.value||"",curCat=fCat.value||"",curKey=fKey.value.trim().toLowerCase();
  const months=[...new Set(state.accounts.map(a=>monthOf(a.date)))].sort().reverse();
  if(!months.includes(m)) months.unshift(m);
  fMonth.innerHTML=['<option value="">全部分月</option>'].concat(months.map(mm=>`<option value="${mm}">${mm.replace("-","年")}月</option>`)).join("");
  const cats=CAT_EXPENSE.concat(CAT_INCOME).map(c=>c[0]);
  fCat.innerHTML=['<option value="">全部分类</option>'].concat(cats.map(c=>`<option value="${c}">${c}</option>`)).join("");
  fMonth.value=curMonth; fCat.value=curCat; fKey.value=curKey;
  const filtered=state.accounts.filter(a=>
    (!curMonth||monthOf(a.date)===curMonth) &&
    (!curCat||a.category===curCat) &&
    (!curKey||(a.note||"").toLowerCase().includes(curKey)||a.category.toLowerCase().includes(curKey))
  ).sort((a,b)=>a.date<b.date?1:-1).slice(0,80);
  renderStats();
  const box=document.getElementById("accList");
  document.getElementById("accTotal").textContent="共 "+state.accounts.length+" 条"+(filtered.length!==state.accounts.length?"（已筛选 "+filtered.length+"）":"");
  if(filtered.length===0){box.innerHTML='<div class="empty">没有符合条件的记录</div>';return;}
  box.innerHTML=renderAccGroupedList(filtered);
}

/* 记账列表折叠状态（内存态，不持久化）：月 / 日 两级 */
const accFold={months:{},days:{}};
const WEEK_CN=["周日","周一","周二","周三","周四","周五","周六"];
function accItemHTML(a){
  return `
    <div class="item">
      <div class="body">
        <div class="t1"><span class="cat-dot" style="background:${catColor(a.type,a.category)}"></span>${esc(a.category)} ${a.note?'· '+esc(a.note):''}</div>
        <div class="t2"><span>${a.date}</span><span class="${a.type==='income'?'amt-in':'amt-out'}">${a.type==='income'?'+':'-'}¥${fmt(a.amount)}</span></div>
      </div>
      <button class="del" data-edit="acc" data-id="${a.id}" title="编辑">✎</button>
      <button class="del" data-del="acc" data-id="${a.id}">✕</button>
    </div>`;
}
function renderAccGroupedList(list){
  // 先按月分组，月内按日分组（list 已按日期降序）
  const months=[],mMap={};
  list.forEach(a=>{
    const mk=monthOf(a.date);
    let g=mMap[mk];
    if(!g){ g=mMap[mk]={key:mk,income:0,expense:0,count:0,dMap:{},days:[]}; months.push(g); }
    g.count++; g[a.type==="income"?"income":"expense"]+=a.amount;
    let d=g.dMap[a.date];
    if(!d){ d=g.dMap[a.date]={key:a.date,income:0,expense:0,items:[]}; g.days.push(d); }
    d.items.push(a); d[a.type==="income"?"income":"expense"]+=a.amount;
  });
  const sumTxt=(inc,out)=>`${out>0?"支出¥"+fmt(out):""}${inc>0?(out>0?" · ":"")+"收入¥"+fmt(inc):""}`;
  let html="";
  months.forEach(gm=>{
    const mFolded=!!accFold.months[gm.key];
    html+=`<div class="fold-head" data-foldm="${gm.key}" role="button" tabindex="0" aria-expanded="${!mFolded}">
      <span class="fh-chev">${mFolded?"▸":"▾"}</span>
      <span class="fh-t">${gm.key.replace("-","年")}月</span>
      <span class="fh-s">${gm.count}笔${sumTxt(gm.income,gm.expense)?" · "+sumTxt(gm.income,gm.expense):""}</span>
    </div>`;
    if(mFolded) return;
    gm.days.sort((a,b)=>a.key<b.key?1:-1).forEach(dg=>{
      const dFolded=!!accFold.days[dg.key];
      const wd=WEEK_CN[weekday(+dg.key.slice(0,4),+dg.key.slice(5,7),+dg.key.slice(8,10))];
      html+=`<div class="fold-head day" data-foldd="${dg.key}" role="button" tabindex="0" aria-expanded="${!dFolded}">
        <span class="fh-chev">${dFolded?"▸":"▾"}</span>
        <span class="fh-t">${+dg.key.slice(5,7)}月${+dg.key.slice(8,10)}日 ${wd}</span>
        <span class="fh-s">${dg.items.length}笔${sumTxt(dg.income,dg.expense)?" · "+sumTxt(dg.income,dg.expense):""}</span>
      </div>`;
      if(!dFolded) html+=dg.items.map(accItemHTML).join("");
    });
  });
  return html;
}

/* 统计分析（趋势 / 分类排行 × 日/周/月/年 周期） */
let statsView="trend";
let statsPeriod="month"; // day / week / month / year
function shortNum(n){ return n>=10000?(n/10000).toFixed(1)+"w":String(Math.round(n)); }
function last6Months(){
  const [Y,M]=todayStr().split("-").map(Number);
  const arr=[];
  for(let i=5;i>=0;i--){ const d=new Date(Y,M-1-i,1); arr.push(d.getFullYear()+"-"+pad(d.getMonth()+1)); }
  return arr;
}
// 周起始（周一）
function weekStart(s){ const d=parseD(s); const w=(d.getDay()+6)%7; d.setDate(d.getDate()-w); return dstr(d); }
// 某周期下最近 n 个桶的 key（升序）
function periodKeys(period,n=6){
  const t=todayStr(); const arr=[];
  if(period==="day"){ for(let i=n-1;i>=0;i--) arr.push(addDays(t,-i)); }
  else if(period==="week"){ const ws=weekStart(t); for(let i=n-1;i>=0;i--) arr.push(addDays(ws,-7*i)); }
  else if(period==="month"){ arr.push(...last6Months()); }
  else { const Y=+t.slice(0,4); for(let i=n-1;i>=0;i--) arr.push(String(Y-i)); }
  return arr;
}
// 记录日期是否落在某周期的桶内
function inPeriod(dateStr,key,period){
  if(period==="day") return dateStr===key;
  if(period==="week") return weekStart(dateStr)===key;
  if(period==="month") return monthOf(dateStr)===key;
  return dateStr.slice(0,4)===key;
}
function renderStats(){
  const seg=document.getElementById("statsSeg"); if(!seg) return;

function trendChart(period){
  const data=periodKeys(period,period==="day"?7:6).map(k=>{
    const list=state.accounts.filter(a=>inPeriod(a.date,k,period));
    return { k,
      inc:list.filter(a=>a.type==="income").reduce((s,a)=>s+a.amount,0),
      out:list.filter(a=>a.type==="expense").reduce((s,a)=>s+a.amount,0) };
  });
  const max=Math.max(1,...data.map(d=>Math.max(d.inc,d.out)));
  const W=360,H=200,bottom=26,topPad=16,pad=34,bw=15,n=data.length;
  const slot=(W-2*pad)/n;
  const plotH=H-bottom-topPad;
  let svg="";
  for(let g=0;g<=4;g++){
    const yy=H-bottom-plotH*g/4;
    svg+=`<line x1="${pad-4}" y1="${yy}" x2="${W-pad+6}" y2="${yy}" stroke="var(--line)" stroke-width="1"/>`;
    svg+=`<text x="2" y="${yy+3}" font-size="9" fill="var(--sub)">${shortNum(max*g/4)}</text>`;
  }
  data.forEach((d,i)=>{
    const cx=pad+slot*i+slot/2;
    const hi=plotH*(d.inc/max), ho=plotH*(d.out/max);
    svg+=`<rect x="${(cx-bw-2).toFixed(1)}" y="${(H-bottom-Math.max(hi,1)).toFixed(1)}" width="${bw}" height="${Math.max(hi,1).toFixed(1)}" rx="3" fill="var(--green)"/>`;
    svg+=`<rect x="${(cx+2).toFixed(1)}" y="${(H-bottom-Math.max(ho,1)).toFixed(1)}" width="${bw}" height="${Math.max(ho,1).toFixed(1)}" rx="3" fill="var(--coral)"/>`;
    const label=period==="year"?d.k:d.k.slice(2).replace("-","/");
    svg+=`<text x="${cx.toFixed(1)}" y="${H-8}" font-size="9" fill="var(--sub)" text-anchor="middle">${label}</text>`;
    if(d.inc>0) svg+=`<text x="${(cx-bw/2-2).toFixed(1)}" y="${(H-bottom-hi-4).toFixed(1)}" font-size="8" fill="var(--green)" text-anchor="middle">${shortNum(d.inc)}</text>`;
    if(d.out>0) svg+=`<text x="${(cx+bw/2+2).toFixed(1)}" y="${(H-bottom-ho-4).toFixed(1)}" font-size="8" fill="var(--coral-d)" text-anchor="middle">${shortNum(d.out)}</text>`;
  });
  const cap={day:"近 7 日",week:"近 6 周",month:"近 6 月",year:"近 6 年"}[period]||"";
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:480px;display:block;margin:0 auto;">${svg}</svg>
    <div style="font-size:11px;color:var(--sub);display:flex;gap:14px;justify-content:center;margin-top:2px;">
      <span><span class="cat-dot" style="background:var(--green)"></span>收入</span>
      <span><span class="cat-dot" style="background:var(--coral)"></span>支出</span>
      <span style="opacity:.75;">（${cap}）</span>
    </div>`;
}
function rankBars(period){
  const t=todayStr();
  const key=period==="day"?t:(period==="week"?weekStart(t):(period==="month"?monthOf(t):t.slice(0,4)));
  const byCat={};
  state.accounts.filter(a=>a.type==="expense"&&inPeriod(a.date,key,period)).forEach(a=>{byCat[a.category]=(byCat[a.category]||0)+a.amount;});
  const entries=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  if(!entries.length) return `<div class="empty">${PERIOD_LABEL[period]}暂无支出</div>`;
  const total=entries.reduce((s,e)=>s+e[1],0);
  const max=entries[0][1];
  return entries.map(([cat,val])=>`
    <div style="margin-bottom:10px;">
      <div style="display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:4px;">
        <span><span class="cat-dot" style="background:${catColor('expense',cat)}"></span>${esc(cat)}
          <span style="color:var(--sub);font-size:11px;">${Math.round(val/total*100)}%</span></span>
        <b style="font-variant-numeric:tabular-nums;">¥${fmt(val)}</b>
      </div>
      <div style="height:8px;background:var(--line);border-radius:999px;overflow:hidden;">
        <div style="height:100%;width:${Math.max(3,val/max*100).toFixed(1)}%;background:${catColor('expense',cat)};border-radius:999px;"></div>
      </div>
    </div>`).join("")+
    `<div style="font-size:11px;color:var(--sub);margin-top:2px;">${PERIOD_LABEL[period]}支出合计 ¥${fmt(total)}</div>`;
}

/* 习惯 */
let calView="month"; // 打卡日历视图：month / week / year
function heatBg(cnt,N){ // 打卡强度 → 颜色
  if(!(N>0)||cnt<=0) return "var(--line)";
  if(cnt>=N) return "var(--coral)";
  if(cnt>=2) return "var(--heat2)";
  return "var(--heat1)";
}
function renderHabits(){
  const t=todayStr();
  const [Y,M]=t.split("-").map(Number);
  const N=state.habits.length;
  document.getElementById("calViewSeg").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.v===calView));
  const head=document.getElementById("habitCalHead"), body=document.getElementById("habitCal");
  if(calView==="week"){
    document.getElementById("habitMonth").textContent="近 7 天";
    head.style.display="none"; body.className="habit-week";
    let cells="";
    for(let i=6;i>=0;i--){
      const ds=addDays(t,-i);
      const d=parseD(ds);
      const cnt=state.habits.filter(h=>h.records[ds]).length;
      const bg=heatBg(cnt,N);
      cells+=`<div class="hweek-day ${ds===t?'today':''}" data-date="${ds}">
        <span class="wd">周${"日一二三四五六"[d.getDay()]}</span>
        <span class="wn">${d.getDate()}</span>
        <span class="hweek-dot" style="background:${bg};color:${bg==='var(--line)'?'var(--sub)':'#fff'}">${cnt}</span>
      </div>`;
    }
    body.innerHTML=cells;
  }else if(calView==="year"){
    document.getElementById("habitMonth").textContent=Y+"年 · 全年热力";
    head.style.display="none"; body.className="habit-year";
    const first=new Date(Y,0,1);
    const cells=[];
    for(let i=0;i<first.getDay();i++) cells.push(null);
    for(let m=1;m<=12;m++){ const dim=daysInMonth(Y,m); for(let d=1;d<=dim;d++) cells.push(Y+"-"+pad(m)+"-"+pad(d)); }
    while(cells.length%7) cells.push(null);
    let cols="";
    for(let i=0;i<cells.length;i+=7){
      cols+='<div class="hyear-col">';
      for(let j=0;j<7;j++){
        const ds=cells[i+j];
        if(!ds){ cols+='<div class="hyear-cell" style="background:transparent;cursor:default"></div>'; continue; }
        const future=ds>t;
        const cnt=state.habits.filter(h=>h.records[ds]).length;
        const [ ,mm,dd]=ds.split("-");
        cols+=`<div class="hyear-cell ${future?'dim':''}" data-date="${ds}" title="${+mm}月${+dd}日：${cnt}/${N}" style="background:${future?'var(--line)':heatBg(cnt,N)}"></div>`;
      }
      cols+="</div>";
    }
    body.innerHTML=cols;
  }else{
    document.getElementById("habitMonth").textContent=Y+"年"+M+"月";
    head.style.display="grid"; body.className="habit-grid";
    head.innerHTML=["日","一","二","三","四","五","六"].map(d=>`<div class="hd">${d}</div>`).join("");
    const dim=daysInMonth(Y,M);
    const first=weekday(Y,M,1);
    let cells="";
    for(let i=0;i<first;i++) cells+=`<div class="day empty"></div>`;
    for(let d=1;d<=dim;d++){
      const ds=Y+"-"+pad(M)+"-"+pad(d);
      const cnt=state.habits.filter(h=>h.records[ds]).length;
      const bg=heatBg(cnt,N);
      const isT=ds===t;
      cells+=`<div class="day" data-date="${ds}" style="cursor:pointer;background:${bg};${isT?'outline:2px solid var(--coral-d);outline-offset:1px;':''}">${d}</div>`;
    }
    body.innerHTML=cells;
  }
  // 习惯列表
  const box=document.getElementById("habitList");
  if(state.habits.length===0){box.innerHTML='<div class="empty">还没有习惯，点「+ 新增」开始</div>';return;}
  box.innerHTML=state.habits.map(h=>{
    const streak=calcStreak(h.records);
    const doneToday=!!h.records[t];
    return `<div class="habit" style="border-left:4px solid ${h.color}">
      <div class="name">${esc(h.name)}</div>
      <div class="streak">🔥 连续 <b class="fire">${streak}</b> 天</div>
      <button class="ic-btn" data-habit="${h.id}" style="${doneToday?'background:var(--coral);color:#fff;':''}">${doneToday?'已打卡':'打卡'}</button>
      <button class="del" data-edit="habit" data-id="${h.id}" title="编辑">✎</button>
      <button class="del" data-del="habit" data-id="${h.id}">✕</button>
    </div>`;
  }).join("");
}
function openDayModal(date){
  const items=state.habits.map(h=>`<label style="display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;cursor:pointer;">
    <input type="checkbox" data-h="${h.id}" ${h.records[date]?'checked':''} style="width:18px;height:18px;flex:0 0 auto;">
    <span style="font-weight:600;">${esc(h.name)}</span>
  </label>`).join("");
  document.getElementById("modalBox").innerHTML=`
    <h3>${date} 打卡</h3>
    ${state.habits.length?`<div style="display:flex;flex-direction:column;gap:8px;">${items}</div>`:'<div class="empty">还没有习惯，先去新增一个吧</div>'}
    <button class="btn-primary" id="mDaySave" style="margin-top:12px;">完成</button>`;
  document.getElementById("mDaySave").addEventListener("click",()=>{
    document.querySelectorAll("#modalBox input[type=checkbox]").forEach(cb=>{
      const h=state.habits.find(z=>z.id===cb.dataset.h);if(!h)return;
      if(cb.checked)h.records[date]=true;else delete h.records[date];
    });
    save();refreshAll();closeModal();
  });
  openModal();
}
function calcStreak(records){
  let s=0;let d=todayStr();
  while(records[d]){s++;d=addDays(d,-1);}
  if(s===0){ // 今天没打，从昨天算
    let d2=addDays(todayStr(),-1);let s2=0;
    while(records[d2]){s2++;d2=addDays(d2,-1);}
    return s2;
  }
  return s;
}

/* 待办 */
function renderTodos(){
  const t=todayStr();
  const active=state.todos.filter(x=>!x.archived);
  const total=active.length;
  const done=active.filter(x=>x.done).length;
  const rate=total?Math.round(done/total*100):0;
  document.getElementById("todoRate").textContent="完成率 "+rate+"%";
  // 归档入口（有归档才显示）
  const archBtn=document.getElementById("todoArchBtn");
  const archN=state.todos.filter(x=>x.archived).length;
  archBtn.style.display=archN?"":"none";
  document.getElementById("archCount").textContent=archN;
  const order={P0:0,P1:1,P2:2};
  const sorted=active.slice().sort((a,b)=>{
    if(a.done!==b.done) return a.done?1:-1;
    if(a.date!==b.date) return a.date<b.date?-1:1;
    return order[a.priority]-order[b.priority];
  });
  const box=document.getElementById("todoList");
  if(sorted.length===0){box.innerHTML='<div class="empty">暂无待办，添加第一项吧</div>';return;}
  box.innerHTML=sorted.map(x=>{
    const overdue=!x.done && x.date<t;
    return `<div class="item ${x.done?'done':''}">
      <div class="chk" data-chk="${x.id}">${x.done?'<svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>':''}</div>
      <div class="body">
        <div class="t1">${esc(x.title)}</div>
        <div class="t2"><span class="pill p-${x.priority}">${x.priority}</span><span style="${overdue?'color:var(--red);':''}">${x.date}${overdue?' · 逾期':''}</span></div>
      </div>
      ${x.done?`<button class="del" data-arch="${x.id}" title="归档">📦</button>`:""}
      <button class="del" data-edit="todo" data-id="${x.id}" title="编辑">✎</button>
      <button class="del" data-del="todo" data-id="${x.id}">✕</button>
    </div>`;
  }).join("");
}

/* ============ 图表（内联 SVG） ============ */
function fmt(n){return (Math.round(n*100)/100).toLocaleString('zh-CN');}
function ring(pct,total,used){
  const r=46,c=2*Math.PI*r,off=c*(1-pct/100);
  return `<svg width="120" height="120" viewBox="0 0 120 120">
    <circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--line)" stroke-width="11"/>
    <circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--coral)" stroke-width="11" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 60 60)"/>
    <text x="60" y="55" text-anchor="middle" font-size="20" font-weight="800" fill="var(--coral-d)">${Math.round(pct)}%</text>
    <text x="60" y="74" text-anchor="middle" font-size="11" fill="var(--sub)">预算 ¥${fmt(total)}</text>
  </svg>`;
}
function pie(entries){
  const total=entries.reduce((s,e)=>s+e[1],0);
  let ang=-Math.PI/2;const cx=70,cy=70,r=58;
  let paths="";
  entries.forEach(([cat,val])=>{
    const a2=ang+val/total*2*Math.PI;
    const x1=cx+r*Math.cos(ang),y1=cy+r*Math.sin(ang);
    const x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2);
    const large=(a2-ang)>Math.PI?1:0;
    paths+=`<path d="M${cx} ${cy} L${x1} ${y1} A${r} ${r} 0 ${large} 1 ${x2} ${y2} Z" fill="${catColor('expense',cat)}"/>`;
    ang=a2;
  });
  const legend=entries.map(([cat,val])=>`<div><span class="cat-dot" style="background:${catColor('expense',cat)}"></span>${esc(cat)} ¥${fmt(val)}</div>`).join("");
  return `<svg width="140" height="140" viewBox="0 0 140 140">${paths}<circle cx="70" cy="70" r="26" fill="#fff"/></svg>
    <div class="legend">${legend}</div>`;
}
function lineChart(data){
  const W=320,H=160,pad=28;
  const ws=data.map(d=>d.weight);
  const fs=data.map(d=>d.fat).filter(v=>v!=null);
  const all=fs.length?ws.concat(fs):ws;
  let min=Math.min(...all),max=Math.max(...all);
  if(min===max){min-=1;max+=1;}
  const span=max-min;
  const n=data.length;
  const x=i=>pad+(W-2*pad)*(n===1?0.5:i/(n-1));
  const y=v=>H-pad-(H-2*pad)*((v-min)/span);
  let pts="",area="",dots="";
  data.forEach((d,i)=>{
    const px=x(i),py=y(d.weight);
    pts+=(i?"L":"M")+px.toFixed(1)+" "+py.toFixed(1)+" ";
    dots+=`<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="3.5" fill="var(--coral)"/>`;
    if(i===0) area=`M${px.toFixed(1)} ${(H-pad)} `;
    area+=`L${px.toFixed(1)} ${py.toFixed(1)} `;
    if(i===n-1) area+=`L${px.toFixed(1)} ${(H-pad)} Z`;
  });
  let fatLine="",fatDots="";
  if(fs.length===n){
    data.forEach((d,i)=>{const px=x(i),py=y(d.fat);fatLine+=(i?"L":"M")+px.toFixed(1)+" "+py.toFixed(1)+" ";fatDots+=`<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="3" fill="#5B8DEF"/>`;});
  }
  const grid=[0,0.5,1].map(f=>{const v=min+span*f;const yy=H-pad-(H-2*pad)*f;return `<line x1="${pad}" y1="${yy}" x2="${W-pad}" y2="${yy}" stroke="var(--line)" stroke-width="1"/><text x="2" y="${yy+3}" font-size="9" fill="var(--sub)">${v.toFixed(1)}</text>`;}).join("");
  const labels=data.map((d,i)=>`<text x="${x(i).toFixed(1)}" y="${H-8}" font-size="8" fill="var(--sub)" text-anchor="middle">${d.date.slice(5)}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="max-width:100%">
    ${grid}
    <path d="${area}" fill="var(--coral-l)" opacity="0.5"/>
    <path d="${pts}" fill="none" stroke="var(--coral)" stroke-width="2.5" stroke-linejoin="round"/>
    ${dots}
    ${fatLine?`<path d="${fatLine}" fill="none" stroke="#5B8DEF" stroke-width="2" stroke-dasharray="4 3"/>`:""}
    ${fatDots}
    ${labels}
  </svg>
  <div style="font-size:11px;color:var(--sub);display:flex;gap:14px;justify-content:center;margin-top:4px;">
    <span><span class="cat-dot" style="background:var(--coral)"></span>体重(kg)</span>
    ${fs.length===n?'<span><span class="cat-dot" style="background:#5B8DEF"></span>体脂(%)</span>':''}
  </div>`;
}

/* ============ 交互 ============ */
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function showTab(name){
  document.querySelectorAll(".sec").forEach(s=>s.classList.remove("active"));
  document.getElementById("sec-"+name).classList.add("active");
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.tab===name));
  document.querySelectorAll("#bottomNav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===name));
  document.querySelectorAll(".drawer-item").forEach(d=>d.classList.toggle("active",d.dataset.tab===name));
  if(isMobile()) closeMobileDrawer();
  window.scrollTo({top:0,behavior:"smooth"});
}

/* ============ 导航：左侧抽屉（可收缩 / 覆盖） ============ */
const NAV_KEY=PREFIX+"nav";
let navCollapsed=false;
function isMobile(){ return window.matchMedia("(max-width:759px)").matches; }
function getNav(){ try{return JSON.parse(localStorage.getItem(NAV_KEY)||"{}");}catch(e){return {};} }
function setNav(o){ const s=getNav(); Object.assign(s,o); localStorage.setItem(NAV_KEY,JSON.stringify(s)); }
function toggleNav(){ // 移动端：开合覆盖抽屉；桌面端：收缩 / 展开图标栏
  const drawer=document.getElementById("drawer"), scrim=document.getElementById("scrim");
  if(isMobile()){
    const open=drawer.classList.toggle("show");
    scrim.classList.toggle("show",open);
    document.getElementById("navToggle").setAttribute("aria-expanded",String(open));
  }else{
    navCollapsed=!navCollapsed;
    drawer.classList.toggle("collapsed",navCollapsed);
    setNav({collapsed:navCollapsed});
    const btn=document.getElementById("navCollapse");
    if(btn) btn.setAttribute("aria-expanded",String(!navCollapsed));
    const ico=btn?btn.querySelector("svg"):null;
    if(ico) ico.style.transform=navCollapsed?"rotate(180deg)":"rotate(0deg)";
  }
}
function closeMobileDrawer(){
  const drawer=document.getElementById("drawer"), scrim=document.getElementById("scrim"), t=document.getElementById("navToggle");
  drawer.classList.remove("show"); scrim.classList.remove("show");
  if(t) t.setAttribute("aria-expanded","false");
}
function applyNav(){ // 视口切换时同步抽屉形态，避免状态错乱
  const drawer=document.getElementById("drawer"), scrim=document.getElementById("scrim");
  if(isMobile()){
    drawer.classList.remove("collapsed");
    closeMobileDrawer();
  }else{
    drawer.classList.toggle("collapsed",navCollapsed);
    const btn=document.getElementById("navCollapse");
    if(btn){ btn.setAttribute("aria-expanded",String(!navCollapsed)); const ico=btn.querySelector("svg"); if(ico) ico.style.transform=navCollapsed?"rotate(180deg)":"rotate(0deg)"; }
  }
}

/* ============ 主题切换（珊瑚橙 / 绿 / 蓝） ============ */
const THEME_KEY=PREFIX+"theme";
function applyTheme(name){
  if(name) document.body.dataset.theme=name; else delete document.body.dataset.theme;
  document.querySelectorAll(".theme-sw").forEach(b=>b.classList.toggle("on",(b.dataset.theme||"")===(name||"")));
}
function setTheme(name){
  if(name) localStorage.setItem(THEME_KEY,name); else localStorage.removeItem(THEME_KEY);
  applyTheme(name);
  const label={ "":"珊瑚橙","green":"清新绿","blue":"天空蓝" }[name||""]||"珊瑚橙";
  toast("已切换到「"+label+"」主题");
}

function bindEvents(){
  // tab（仅带 data-tab 的导航项；抽屉工具行「云端服务/数据备份/清空数据」单独绑定）
  document.querySelectorAll(".tab,#bottomNav button,.drawer-item[data-tab]").forEach(b=>b.addEventListener("click",()=>showTab(b.dataset.tab)));
  // 导航：汉堡开合抽屉 / 收缩；遮罩点关
  document.getElementById("navToggle").addEventListener("click",toggleNav);
  document.getElementById("navCollapse").addEventListener("click",toggleNav);
  document.getElementById("scrim").addEventListener("click",closeMobileDrawer);
  window.addEventListener("resize",applyNav);
  // 主题切换
  document.getElementById("themeRow").addEventListener("click",e=>{
    const b=e.target.closest(".theme-sw"); if(b) setTheme(b.dataset.theme);
  });
  // 今天要处理：顶栏图标 → 弹框（列表内「完成」在弹框渲染时绑定）
  document.getElementById("todayBtn").addEventListener("click",openTodayModal);
  // 记账：点击 + 图标 → 弹框录入
  document.getElementById("accAddBtn").addEventListener("click",addAccountModal);
  document.getElementById("accEditBudget").addEventListener("click",editBudget);
  document.getElementById("accFMonth").addEventListener("change",renderAccounting);
  document.getElementById("accFCat").addEventListener("change",renderAccounting);
  document.getElementById("accFKey").addEventListener("input",renderAccounting);
  // 统计分析视图切换 + 模板管理
  document.getElementById("statsSeg").addEventListener("click",e=>{
    const b=e.target.closest("button[data-v]"); if(!b) return;
    statsView=b.dataset.v; renderStats();
  });
  document.getElementById("statsPeriodSeg").addEventListener("click",e=>{
    const b=e.target.closest("button[data-v]"); if(!b) return;
    statsPeriod=b.dataset.v; renderStats();
  });
  document.getElementById("tplMgr").addEventListener("click",openTplModal);
  // 习惯
  document.getElementById("habitAdd").addEventListener("click",openHabitModal);
  document.getElementById("calViewSeg").addEventListener("click",e=>{
    const b=e.target.closest("button[data-v]"); if(!b) return;
    calView=b.dataset.v; renderHabits();
  });
  document.getElementById("habitCal").addEventListener("click",e=>{
    const d=e.target.closest("[data-date]"); if(!d) return;
    if(d.dataset.date>todayStr()) return; // 未来日期不可打卡
    openDayModal(d.dataset.date);
  });
  document.getElementById("habitList").addEventListener("click",e=>{
    const b=e.target.closest("[data-habit]"); if(b){const h=state.habits.find(z=>z.id===b.dataset.habit);if(h){h.records[todayStr()]=!h.records[todayStr()];save();refreshAll();}return;}
    const ed=e.target.closest("[data-edit='habit']"); if(ed){editHabit(ed.dataset.id);return;}
    const d=e.target.closest("[data-del='habit']"); if(d){state.habits=state.habits.filter(z=>z.id!==d.dataset.id);save();refreshAll();}
  });
  // 待办：点击 + 图标 → 弹框录入
  document.getElementById("todoAddBtn").addEventListener("click",addTodoModal);
  document.getElementById("todoArchBtn").addEventListener("click",openArchModal);
  document.getElementById("todoList").addEventListener("click",e=>{
    const c=e.target.closest("[data-chk]"); if(c){const x=state.todos.find(z=>z.id===c.dataset.chk);if(x){x.done=!x.done;save();refreshAll();}return;}
    const ar=e.target.closest("[data-arch]"); if(ar){const x=state.todos.find(z=>z.id===ar.dataset.arch);if(x){x.archived=true;save();refreshAll();toast("已归档，可在「📦 归档」中查看");}return;}
    const ed=e.target.closest("[data-edit='todo']"); if(ed){editTodo(ed.dataset.id);return;}
    const d=e.target.closest("[data-del='todo']"); if(d){state.todos=state.todos.filter(z=>z.id!==d.dataset.id);save();refreshAll();}
  });
  // 减脂：点击 + 图标 → 弹框录入
  document.getElementById("fitAddBtn").addEventListener("click",addFitnessModal);
  document.getElementById("fitList").addEventListener("click",e=>{
    const ed=e.target.closest("[data-edit='fit']"); if(ed){editFitness(ed.dataset.id);return;}
    const d=e.target.closest("[data-del='fit']"); if(d){state.fitness=state.fitness.filter(z=>z.id!==d.dataset.id);save();refreshAll();}
  });
  // 删除记账（事件委托到 accList）；折叠头：先处理月/日折叠
  document.getElementById("accList").addEventListener("click",e=>{
    const fm=e.target.closest("[data-foldm]");
    if(fm){ accFold.months[fm.dataset.foldm]=!accFold.months[fm.dataset.foldm]; renderAccounting(); return; }
    const fd=e.target.closest("[data-foldd]");
    if(fd){ accFold.days[fd.dataset.foldd]=!accFold.days[fd.dataset.foldd]; renderAccounting(); return; }
    const ed=e.target.closest("[data-edit='acc']"); if(ed){editAccount(ed.dataset.id);return;}
    const d=e.target.closest("[data-del='acc']"); if(d){state.accounts=state.accounts.filter(z=>z.id!==d.dataset.id);save();refreshAll();}
  });
  // 抽屉工具入口：云端服务 / 数据备份 / 清空数据（点击弹框）
  document.getElementById("menuCloud").addEventListener("click",()=>{ closeMobileDrawer(); openCloudModal(); });
  document.getElementById("menuBackup").addEventListener("click",()=>{ closeMobileDrawer(); openBackupModal(); });
  document.getElementById("menuClear").addEventListener("click",()=>{ closeMobileDrawer(); clearSample(); });
  document.getElementById("fileInput").addEventListener("change",importJSON);
  // modal close
  document.getElementById("mask").addEventListener("click",e=>{if(e.target.id==="mask")closeModal();});
  document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});
  // 全面禁用双击放大（touch-action:manipulation 为主，这里兜底拦截双击/多指缩放）
  document.addEventListener("dblclick",e=>e.preventDefault(),{passive:false});
  document.addEventListener("gesturestart",e=>e.preventDefault(),{passive:false});
}
function addAccountModal(){
  document.getElementById("modalBox").innerHTML=`

    </div>

      <button class="btn-primary" id="mAAddSave" style="flex:1;margin-top:0;">保存记录</button>
    </div>`;
  let type="expense";
  const fill=()=>{const arr=type==="income"?CAT_INCOME:CAT_EXPENSE;document.getElementById("mAAddCat").innerHTML=arr.map(c=>`<option value="${c[0]}">${c[0]}</option>`).join("");};
  document.querySelectorAll("#mAAddType button").forEach(b=>b.addEventListener("click",()=>{type=b.dataset.v;document.querySelectorAll("#mAAddType button").forEach(x=>x.classList.toggle("on",x===b));fill();}));
  fill();
  // 模板快捷条：点击带入表单
  const renderChips=()=>{
    document.getElementById("mTplChips").innerHTML=(state.templates||[]).map(tp=>
      `<button class="tpl-chip" data-id="${tp.id}" title="点击带入表单">${esc(tp.name)} <small>¥${fmt(tp.amount)}</small></button>`).join("");
  };
  renderChips();
  document.getElementById("mTplChips").addEventListener("click",e=>{
    const chip=e.target.closest(".tpl-chip"); if(!chip) return;
    const tp=(state.templates||[]).find(z=>z.id===chip.dataset.id); if(!tp) return;
    type=tp.type||"expense";
    document.querySelectorAll("#mAAddType button").forEach(x=>x.classList.toggle("on",x.dataset.v===type));
    fill();
    const catSel=document.getElementById("mAAddCat");
    if(tp.category && !Array.from(catSel.options).some(o=>o.value===tp.category)) catSel.add(new Option(tp.category,tp.category));
    catSel.value=tp.category||catSel.value;
    document.getElementById("mAAddAmount").value=tp.amount;
    document.getElementById("mAAddNote").value=tp.note||"";
  });
  // 存为模板（同名覆盖）
  document.getElementById("mTplSave").addEventListener("click",()=>{
    const amount=parseFloat(document.getElementById("mAAddAmount").value);
    if(!(amount>0)){ toast("请先填写有效金额再存为模板",true); return; }
    const category=document.getElementById("mAAddCat").value;
    const note=document.getElementById("mAAddNote").value.trim();
    const name=note||category;
    if(!state.templates) state.templates=[];
    const exist=state.templates.find(z=>z.name===name);
    if(exist){ exist.type=type; exist.category=category; exist.amount=amount; exist.note=note; }
    else state.templates.push({id:uid(),name,type,category,amount,note});
    save(); renderChips();
    toast("已存为模板「"+name+"」");
  });
  document.getElementById("mAAddClose").addEventListener("click",closeModal);
  document.getElementById("mAAddSave").addEventListener("click",()=>{
    const amount=parseFloat(document.getElementById("mAAddAmount").value);
    if(!(amount>0)){toast("请输入有效金额",true);return;}
    state.accounts.push({id:uid(),type,amount,category:document.getElementById("mAAddCat").value,date:document.getElementById("mAAddDate").value||todayStr(),note:document.getElementById("mAAddNote").value.trim()});
    save();refreshAll();closeModal();
  });
  openModal();
  setTimeout(()=>{const el=document.getElementById("mAAddAmount");if(el)el.focus();},50);
}
