  const color=HABIT_COLORS[used%HABIT_COLORS.length];
  document.getElementById("modalBox").innerHTML=`
    <h3>新增习惯</h3>
    <div class="field"><label>习惯名称</label><input type="text" id="mHabitName" placeholder="如：早睡、冥想"></div>
    <div class="field"><label>颜色</label><div id="mColorRow" style="display:flex;gap:8px;flex-wrap:wrap;"></div></div>
    <button class="btn-primary" id="mHabitSave">添加</button>`;
  let sel=color;
  document.getElementById("mColorRow").innerHTML=HABIT_COLORS.map(c=>`<div data-c="${c}" style="width:34px;height:34px;border-radius:50%;background:${c};cursor:pointer;border:3px solid ${c===sel?'#fff':'transparent'};box-shadow:0 0 0 1px #ddd;}"></div>`).join("");
  document.querySelectorAll("#mColorRow div").forEach(d=>d.addEventListener("click",()=>{
    sel=d.dataset.c;
    document.querySelectorAll("#mColorRow div").forEach(x=>x.style.borderColor=x.dataset.c===sel?'#fff':'transparent');
  }));
  document.getElementById("mHabitSave").addEventListener("click",()=>{
    const name=document.getElementById("mHabitName").value.trim();
    if(!name){toast("请输入习惯名称",true);return;}
    state.habits.push({id:uid(),name,color:sel,records:{}});
    save();refreshAll();closeModal();
  });
  openModal();
}
function openModal(){document.getElementById("mask").classList.add("show");}
function closeModal(){document.getElementById("mask").classList.remove("show");}

/* 备份 */
function totalCount(){return state.todos.length+state.accounts.length+state.habits.length+state.fitness.length;}
function checkBackupHint(){
  let hint=document.querySelector(".warn");
  if(totalCount()>=30 && !hint){
    hint=document.createElement("div");hint.className="warn";
    hint.innerHTML='<svg viewBox="0 0 24 24" width="16" height="16" fill="none"><path d="M12 9v4M12 17h.01" stroke="#B5760A" stroke-width="2" stroke-linecap="round"/><path d="M10.3 3.9 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z" stroke="#B5760A" stroke-width="2"/></svg>数据已积累 '+totalCount()+' 条，建议在左侧「数据备份」导出 JSON 防止丢失';
    const wrap=document.querySelector(".wrap");
    if(wrap) wrap.insertBefore(hint,wrap.firstElementChild);
  }
}
function exportJSON(){
  const data={todos:state.todos,accounts:state.accounts,habits:state.habits,fitness:state.fitness,templates:state.templates||[],budget:state.budget,exportedAt:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="全能工作台备份_"+todayStr()+".json";a.click();
  URL.revokeObjectURL(a.href);
}
function exportCSV(){
  const rows=[["日期","类型","分类","金额","备注"]];
  state.accounts.slice().sort((a,b)=>a.date<b.date?1:-1).forEach(a=>rows.push([a.date,a.type==="income"?"收入":"支出",a.category,a.amount,a.note||""]));
  const csv=rows.map(r=>r.map(c=>{c=String(c);return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}).join(",")).join("\n");
  const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="全能工作台记账_"+todayStr()+".csv";a.click();
  URL.revokeObjectURL(a.href);
}
function importJSON(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(d.todos)state.todos=d.todos;
      if(d.accounts)state.accounts=d.accounts;
      if(d.habits)state.habits=d.habits;
      if(d.fitness)state.fitness=d.fitness;
      if(d.templates)state.templates=d.templates;
      if(d.budget!=null)state.budget=d.budget;
      migrateLegacy();
      save();refreshAll();
      openImportDoneModal(totalCount());
    }catch(err){ toast("文件格式错误，导入失败",true); }
  };
  r.readAsText(f);e.target.value="";
}
// 导入成功 → 应用内弹框（替代原生 alert，webview 中会被拦截）

    <button class="btn-primary" id="mImpOk" style="margin-top:0;">好的</button>`;

/* ============ 云端同步（Cloudflare Pages Functions + D1，表前缀 wba_） ============ */
const CLOUD_KEY=PREFIX+"cloud";
let CLOUD={on:false,user:null,auto:true,syncing:false,lastErr:""};
let _pushTimer=null;
function cloudLoad(){try{const o=JSON.parse(localStorage.getItem(CLOUD_KEY)||"{}");CLOUD.user=o.user||null;CLOUD.auto=o.auto!==false;}catch(e){}}
function cloudStore(){try{localStorage.setItem(CLOUD_KEY,JSON.stringify({user:CLOUD.user,auto:CLOUD.auto}));}catch(e){}}
function cloudOnline(){return CLOUD.on && (typeof navigator==="undefined"||navigator.onLine!==false);}
async function apiFetch(path,opts={}){
  let r;
  try{ r=await fetch(path,Object.assign({credentials:"same-origin",headers:{"content-type":"application/json"}},opts)); }
  catch(e){ throw new Error("NETWORK"); }
  if(!r.ok){
    let e=null; try{ e=await r.json(); }catch(_){}
    if(r.status===401) CLOUD.on=false;
    throw new Error((e&&e.error)||("HTTP "+r.status));
  }
  return r.json();
}
// 启动探测：200 = 已登录（带会话）；401 = 未登录；404 / 网络 = 纯本地模式
async function bootCloud(){
  try{
    const r=await fetch("/api/me",{credentials:"same-origin"});
    if(r.status===200){ CLOUD.on=true; const d=await r.json(); if(d.user&&d.user.email) CLOUD.user=d.user.email; cloudStore(); }
    else if(r.status===401){ CLOUD.on=false; CLOUD.user=null; cloudStore(); } // 会话失效
    else CLOUD.on=false; // 无后端 / 其他异常：保留 cloudUser 供离线展示
  }catch(e){ CLOUD.on=false; }
  buildAccountArea(); updateSyncPill();
}
async function cloudRegister(email,pw){
  const d=await apiFetch("/api/auth/register",{method:"POST",body:JSON.stringify({email,pw})});
  CLOUD.on=true; CLOUD.user=d.user.email; cloudStore(); return d;
}
async function cloudLogin(email,pw){
  const d=await apiFetch("/api/auth/login",{method:"POST",body:JSON.stringify({email,pw})});
  CLOUD.on=true; CLOUD.user=d.user.email; cloudStore(); return d;
}
async function cloudLogout(){
  try{ await apiFetch("/api/auth/logout",{method:"POST"}); }catch(e){}
  CLOUD.user=null; cloudStore(); buildAccountArea(); updateSyncPill();
}
// 本地 → 云端：整包覆盖
async function cloudPush(){
  if(!cloudOnline()) throw new Error("离线或云端不可用");
  CLOUD.syncing=true;
  try{
    await apiFetch("/api/me",{method:"PUT",body:JSON.stringify({data:state})});
    CLOUD.lastErr=""; return true;
  }catch(e){ CLOUD.lastErr=String((e&&e.message)||e); throw e; }
  finally{ CLOUD.syncing=false; updateSyncPill(); }
}
// 云端 → 本地：整包覆盖（替换本机 state）；返回拉到的记录条数
async function cloudPull(){
  if(!cloudOnline()) throw new Error("离线或云端不可用");
  CLOUD.syncing=true;
  try{
    const d=await apiFetch("/api/me");
    const inc=d.data||{};
    takeSnapshot("拉取云端前自动备份");
    state=Object.assign({todos:[],accounts:[],habits:[],fitness:[],templates:[],budget:3000,seeded:true},inc);
    save(); refreshAll(); CLOUD.lastErr="";
    const n=(inc.todos?inc.todos.length:0)+(inc.accounts?inc.accounts.length:0)+(inc.habits?inc.habits.length:0)+(inc.fitness?inc.fitness.length:0);
    return n;
  }catch(e){ CLOUD.lastErr=String((e&&e.message)||e); throw e; }
  finally{ CLOUD.syncing=false; }
}
// 登录后首同步：云端有数据则拉取覆盖，否则上传本机
async function afterLoginSync(){
  try{
    const d=await apiFetch("/api/me");
    const inc=d.data||{};
    const hasData=(inc.todos&&inc.todos.length)||(inc.accounts&&inc.accounts.length)||(inc.habits&&inc.habits.length)||(inc.fitness&&inc.fitness.length);
    if(hasData){
      state=Object.assign({todos:[],accounts:[],habits:[],fitness:[],templates:[],budget:3000,seeded:true},inc);
      save(); refreshAll(); toast("已从云端同步数据到本机 ✓");
    }else{
      await cloudPush(); toast("已将本机数据上传到云端 ✓");
    }
  }catch(e){ toast("登录成功，但同步失败："+(e.message||e),true); }
}
// 改动后防抖自动上传（拉取过程中/拉取后的保存不回推，避免覆盖云端造成「从云端同步无效」）
function scheduleCloudPush(){
  if(CLOUD.skipPush){ CLOUD.skipPush=false; return; } /* 一次性跳过（如清空本地数据后不回推） */
  if(CLOUD.syncing) return;
  if(!CLOUD.on||!CLOUD.user||!CLOUD.auto) return;
  if(_pushTimer) clearTimeout(_pushTimer);
  _pushTimer=setTimeout(()=>{ cloudPush().then(()=>updateSyncPill()).catch(()=>{}); },1000);
}
function updateSyncPill(){
  const t=document.getElementById("syncText"); if(!t) return;
  const dot=document.querySelector(".sync .dot");
  if(CLOUD.user){ t.textContent="已同步云端"; if(dot) dot.style.background="#9CF0C2"; }
  else{ t.textContent="本地存储"; if(dot) dot.style.background=""; }
}
// 抽屉「云端服务」行的状态小字
function buildAccountArea(){
  const el=document.getElementById("cloudRowSub"); if(!el) return;
  el.textContent = CLOUD.user ? (CLOUD.on ? CLOUD.user : CLOUD.user+"（未连接）") : "未登录";
}
// 云端服务弹框：未登录 → 登录/注册面板；已登录 → 账户信息 + 同步操作
function openCloudModal(){
  if(!CLOUD.user){ openCloudPanel(); return; }
  const box=document.getElementById("modalBox");
  box.innerHTML=`
    <div class="modal-h"><h3>☁ 云端服务</h3><button class="modal-x" id="mClX" aria-label="关闭">关闭</button></div>
    <div class="da-user">
      <div class="da-avatar">${esc(CLOUD.user.slice(0,1).toUpperCase())}</div>
      <div class="da-info"><div class="da-name">${esc(CLOUD.user)}</div><div class="da-sub" id="mClState">${CLOUD.on?"已连接云端":"未连接（离线）"}</div></div>
    </div>
    <div class="db-actions">
      <button class="db-btn" id="daSync">☁ 同步到云端（本机 → 云端）</button>
      <button class="db-btn" id="daPull">⬇ 从云端同步（云端 → 本机）</button>
      <button class="db-btn" id="daAuto">${CLOUD.auto?"✓ 自动同步：开":"○ 自动同步：关"}</button>
      <button class="db-btn danger" id="daLogout">退出登录</button>
    </div>
    <p style="font-size:11.5px;color:var(--sub);margin:10px 0 0;">同步为整包覆盖：上传会覆盖云端副本，拉取会覆盖本机数据（拉取前自动快照）。</p>`;
  document.getElementById("mClX").addEventListener("click",closeModal);
  document.getElementById("daSync").addEventListener("click",()=>{
    confirmModal({
      title:"☁ 同步到云端",
      msg:"将把<strong>本机当前全部数据上传并覆盖云端副本</strong>。确定继续吗？",
      okText:"开始上传",
      onOk:async()=>{ try{ await cloudPush(); toast("已同步到云端 ✓"); }catch(e){ toast("同步失败："+(e.message||e),true); } }
    });
  });
  document.getElementById("daPull").addEventListener("click",()=>{
    confirmModal({
      title:"⬇ 从云端同步",
      msg:"将用<strong>云端数据覆盖本机全部数据</strong>，本机未上传的改动将丢失（拉取前自动快照，可在「数据备份 → 本地快照」找回）。确定继续吗？",
      okText:"开始同步",
      onOk:async()=>{
        try{
          const n=await cloudPull();
          toast(n>0?("已从云端同步 "+n+" 条数据到本机 ✓"):"云端暂无数据，本机保持不变");
        }catch(e){ toast("同步失败："+(e.message||e),true); }
      }
    });
  });
  document.getElementById("daAuto").addEventListener("click",()=>{ CLOUD.auto=!CLOUD.auto; cloudStore(); buildAccountArea(); toast(CLOUD.auto?"已开启自动同步":"已关闭自动同步"); openCloudModal(); });
  document.getElementById("daLogout").addEventListener("click",async()=>{ await cloudLogout(); closeModal(); toast("已退出登录"); });
  openModal();
}
// 数据备份弹框：导出 / 导入 / 快照
function openBackupModal(){
  const box=document.getElementById("modalBox");
  box.innerHTML=`
    <div class="modal-h"><h3>🗄 数据备份</h3><button class="modal-x" id="mBkClose" aria-label="关闭">关闭</button></div>
    <p style="font-size:12.5px;color:var(--sub);margin:0 0 10px;">数据保存在本机浏览器（localStorage），建议定期导出备份。</p>
    <div class="db-actions">
      <button class="db-btn" id="btnExport">📤 导出 JSON 备份</button>
      <button class="db-btn" id="btnExportCSV">📄 导出 CSV（仅记账）</button>
      <button class="db-btn" id="btnImport">📥 导入恢复（JSON）</button>
      <button class="db-btn" id="btnSnap">📸 本地快照（最多 3 份）</button>
    </div>`;
  document.getElementById("mBkClose").addEventListener("click",closeModal);
  document.getElementById("btnExport").addEventListener("click",exportJSON);
  document.getElementById("btnExportCSV").addEventListener("click",exportCSV);
  document.getElementById("btnImport").addEventListener("click",()=>document.getElementById("fileInput").click());
  document.getElementById("btnSnap").addEventListener("click",openSnapModal);
  openModal();
}
function openCloudPanel(){
  const box=document.getElementById("modalBox");
  if(CLOUD.user){ closeModal(); return; }
  box.innerHTML=`
    <div class="modal-h"><h3>☁ 登录 / 注册</h3><button class="modal-x" id="clClose">关闭</button></div>
    <p style="font-size:13px;color:var(--sub);margin:0 0 12px;">注册一个云端账号，多设备同步你的工作台数据（数据存于你自己的 Cloudflare D1 数据库，表前缀 wba_）。</p>
    <div class="field"><label>邮箱</label><input id="clEmail" type="email" autocomplete="username" placeholder="you@example.com"></div>
    <div class="field"><label>密码（至少 6 位）</label><input id="clPw" type="password" autocomplete="current-password" placeholder="设置密码"></div>
    <div style="display:flex;gap:8px;">
      <button class="btn-primary" id="clReg" style="margin-top:0;flex:1;">注册</button>
      <button class="btn-primary" id="clLogin" style="margin-top:0;flex:1;background:var(--coral-d);">登录</button>
    </div>
    <div id="clStatus" style="font-size:12px;margin-top:10px;min-height:16px;"></div>`;
  box.querySelector("#clClose").onclick=closeModal;
  const emailEl=box.querySelector("#clEmail"),pwEl=box.querySelector("#clPw"),statusEl=box.querySelector("#clStatus");
  const submit=async(mode)=>{
    const email=emailEl.value.trim(),pw=pwEl.value;
    if(!/^\S+@\S+\.\S+$/.test(email)){ statusEl.textContent="请输入有效的邮箱"; statusEl.style.color="var(--red)"; return; }
    if(!pw||pw.length<6){ statusEl.textContent="密码至少 6 位"; statusEl.style.color="var(--red)"; return; }
    statusEl.textContent=mode==="reg"?"正在注册…":"正在登录…"; statusEl.style.color="var(--sub)";
    try{
      if(mode==="reg") await cloudRegister(email,pw); else await cloudLogin(email,pw);
      statusEl.textContent="登录成功 ✓"; statusEl.style.color="var(--green)";
      await afterLoginSync();
      closeModal(); buildAccountArea(); updateSyncPill();
    }catch(e){ statusEl.textContent=(mode==="reg"?"注册":"登录")+"失败："+(e.message||e); statusEl.style.color="var(--red)"; }
  };
  box.querySelector("#clReg").onclick=()=>submit("reg");
  box.querySelector("#clLogin").onclick=()=>submit("login");
  pwEl.addEventListener("keydown",e=>{ if(e.key==="Enter") submit("login"); });
  openModal();
  setTimeout(()=>{ const el=document.getElementById("clEmail"); if(el) el.focus(); },50);
}
function toast(msg,isErr){
  let t=document.getElementById("wbToast");
  if(!t){
    t=document.createElement("div"); t.id="wbToast";
    t.style.cssText="position:fixed;left:50%;bottom:84px;z-index:80;background:rgba(43,43,51,.94);color:#fff;font-size:13px;padding:9px 14px;border-radius:10px;max-width:88vw;box-shadow:0 6px 20px rgba(0,0,0,.2);transition:opacity .25s,transform .25s;pointer-events:none;text-align:center;";
    document.body.appendChild(t);
  }
  t.textContent=msg; t.style.background=isErr?"rgba(200,64,60,.95)":"rgba(43,43,51,.94)";
  void t.offsetWidth; t.classList.add("on");
  clearTimeout(t._tm); t._tm=setTimeout(()=>{ t.classList.remove("on"); },2200);
}
/* 应用内二次确认弹框（替代原生 confirm，内嵌 webview 中原生对话框会被拦截导致按钮失效） */
function confirmModal(opt){
  const box=document.getElementById("modalBox");
  box.innerHTML=`
    <div class="modal-h"><h3>${opt.title||"确认操作"}</h3><button class="modal-x" id="cmX" aria-label="关闭">关闭</button></div>
    <p style="font-size:13.5px;color:var(--ink);line-height:1.8;margin:0 0 14px;">${opt.msg||""}</p>
    <div style="display:flex;gap:8px;">
      <button class="ic-btn" id="cmCancel" style="flex:1;background:#F1F2F5;color:var(--sub);">取消</button>
      <button class="btn-primary" id="cmOk" style="flex:1;margin-top:0;${opt.danger?"background:#D9554F;box-shadow:0 8px 18px rgba(217,83,79,.28);":""}">${opt.okText||"确认"}</button>
    </div>`;
  document.getElementById("cmX").addEventListener("click",closeModal);
  document.getElementById("cmCancel").addEventListener("click",closeModal);
  document.getElementById("cmOk").addEventListener("click",()=>{ closeModal(); if(opt.onOk) opt.onOk(); });
  openModal();
}
window.addEventListener("online",()=>{ const b=document.getElementById("offlineBanner"); if(b) b.style.display="none"; if(CLOUD.on&&CLOUD.auto) scheduleCloudPush(); });
window.addEventListener("offline",()=>{ const b=document.getElementById("offlineBanner"); if(b) b.style.display="block"; });

  navCollapsed = !!getNav().collapsed;
  applyTheme(localStorage.getItem(THEME_KEY)||"");

  seed();
  bindEvents();
  applyNav();

  buildAccountArea();
  bootCloud();
  if(typeof navigator!=="undefined" && navigator.onLine===false){
    const b=document.getElementById("offlineBanner"); if(b) b.style.display="block";
  }
});
